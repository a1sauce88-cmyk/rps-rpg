    const shopHeaderPad = mobilePortrait ? 'pr-[96px]' : 'pr-[120px]';
    const shopTitleClass = mobilePortrait ? 'text-[48px]' : 'text-5xl';
    const tabs = [
        { id: 'equip', name: '장비 업그레이드' }, { id: 'consumable', name: '소모품' }, { id: 'buff', name: '버프' }
    ];
    let itemsHtml = '';

    if (state.shopTab === 'equip') {
        itemsHtml = ['weapon', 'armor', 'accessory'].map(type => {
            const currentLv = state.player.equipLevel[type];
            const nextUpgrade = UPGRADES[type][currentLv];
            if (!nextUpgrade) {
                const maxItem = UPGRADES[type][UPGRADES[type].length - 1];
                return `
                <div class="bg-slate-800/80 backdrop-blur-md p-4 rounded-3xl border-4 border-yellow-500/70 shadow-xl flex flex-col gap-3 min-h-[170px]">
                    <div class="text-left">
                        <h3 class="text-[26px] font-bold text-yellow-300 leading-snug break-keep">${maxItem.name}</h3>
                        <p class="text-lg text-slate-300 mt-3">최대 강화 완료</p>
                    </div>
                    <div class="mt-auto bg-yellow-600/20 border-2 border-yellow-500/40 text-yellow-300 text-xl font-bold py-3 rounded-2xl text-center">완료</div>
                </div>`;
            }
            const canBuy = state.player.gold >= nextUpgrade.price;
            const statText = nextUpgrade.atk ? `공격력 +${nextUpgrade.atk}` : (nextUpgrade.hp ? `최대 체력 +${nextUpgrade.hp}` : `최대 기력 +${nextUpgrade.energy}`);
            return `
            <div class="bg-slate-800/80 backdrop-blur-md p-4 rounded-3xl border-4 ${canBuy ? 'border-slate-500 hover:-translate-y-1 transition-transform shadow-lg' : 'border-slate-600 opacity-70'} flex flex-col gap-3 min-h-[170px]">
                <div class="text-left">
                    <h3 class="text-[25px] font-bold text-white leading-snug break-keep">${nextUpgrade.name}</h3>
                    <p class="text-[20px] text-slate-200 mt-3 leading-snug">${statText} <span class="text-yellow-400">(현재 Lv.${currentLv})</span></p>
                </div>
                <button onclick="upgradeEquip('${type}')" ${!canBuy ? 'disabled' : ''} class="mt-auto ${canBuy ? 'bg-blue-600 hover:bg-blue-500 border-blue-800 shadow-xl' : 'bg-slate-700 cursor-not-allowed border-slate-800 text-slate-400'} text-[28px] font-bold py-4 px-4 rounded-2xl border-b-8 active:border-b-0 active:mt-auto transition-all w-full">
                    💰 ${nextUpgrade.price}
                </button>
            </div>`;
        }).join('');
    } else {
        itemsHtml = SHOP_ITEMS[state.shopTab].map(item => {
            const canBuy = state.player.gold >= item.price && !item.bought;
            let btnStr = item.bought ? '품절' : `💰 ${item.price}`;
            return `
            <div class="bg-slate-800/80 backdrop-blur-md p-4 rounded-3xl border-4 ${canBuy ? 'border-slate-500 hover:-translate-y-1 transition-transform shadow-lg' : 'border-slate-600 opacity-60'} flex flex-row justify-between items-center gap-4 min-h-[150px]">
                <div class="flex-1 w-full text-left min-w-0">
                    <h3 class="text-[22px] font-bold ${item.bought ? 'line-through text-slate-400' : 'text-white'} mb-2 drop-shadow break-keep leading-snug">${item.name}</h3>
                    <p class="text-[17px] text-slate-300 leading-snug text-balance drop-shadow-sm">${item.desc}</p>
                </div>
                <button onclick="buyItem('${item.id}', '${state.shopTab}')" ${!canBuy ? 'disabled' : ''} class="${canBuy ? 'bg-blue-600 hover:bg-blue-500 border-blue-800 shadow-xl' : 'bg-slate-700 cursor-not-allowed border-slate-800 text-slate-400'} text-[24px] font-bold py-4 px-5 rounded-2xl border-b-8 active:border-b-0 active:mt-2 transition-all shrink-0 w-[150px]">
                    ${btnStr}
                </button>
            </div>`;
        }).join('');
    }

    const gridClass = mobilePortrait ? 'grid-cols-1' : (state.shopTab === 'equip' ? 'grid-cols-3' : 'grid-cols-2');

    return audioBtn + `
        <div class="w-full h-full flex flex-col items-center justify-center ${transitionClass} bg-cover bg-center relative" style="background-image: url('${bgImage}');">
            <div class="absolute inset-0 bg-slate-900/80 z-0"></div>
            <div class="z-10 relative flex flex-col h-full ${shopShellClass} mx-auto w-full">
                <div class="flex flex-row justify-between items-center mb-5 border-b-4 border-slate-700/50 pb-4 mt-2 gap-4 shrink-0 ${shopHeaderPad}">
                    <h2 class="${shopTitleClass} text-yellow-400 title-font drop-shadow-md">상점 🛒</h2>
                    <div class="text-3xl font-bold text-yellow-300 bg-slate-900/80 backdrop-blur-sm px-5 py-3 rounded-3xl flex items-center gap-3 border-2 border-slate-600 shadow-inner">
                        <img onerror="this.onerror=null; this.style.display='none';" src="./assets_hero/${state.player.cls.imgPrefix}_idle.png" class="border-4 border-slate-500 rounded-2xl bg-white shadow-md object-contain w-[54px] h-[54px]" style="image-rendering: pixelated;" alt="Player">
                        💰 <span id="shop-gold">${state.player.gold}</span>
                    </div>
                </div>

                <div class="flex gap-4 mb-0 z-10 relative shrink-0">
                    ${tabs.map(t => `
                        <button onclick="changeShopTab('${t.id}')" class="flex-1 py-4 text-[28px] font-bold rounded-t-3xl border-t-4 border-x-4 transition-all focus:outline-none backdrop-blur-md ${state.shopTab === t.id ? 'tab-active shadow-xl z-20 border-b-0' : 'tab-inactive border-b-4 hover:bg-slate-700'}">
                            ${t.name}
                        </button>
                    `).join('')}
                </div>
                
                <div class="flex-1 overflow-y-auto no-scrollbar bg-slate-900/60 backdrop-blur-sm p-5 rounded-b-3xl border-4 border-slate-600 relative z-0 shadow-inner mb-3 min-h-0">
                    <div class="grid ${gridClass} gap-4 auto-rows-fr">
                        ${itemsHtml}
                    </div>
                </div>
                
                <div id="shop-msg" class="text-center text-xl text-green-400 h-8 font-bold mb-2 drop-shadow shrink-0"></div>
                
                <button onclick="closeOverlay()" class="shrink-0 bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 px-8 rounded-3xl shadow-xl border-b-8 border-slate-800 active:border-b-0 active:mt-2 transition-all w-full text-3xl mb-2">정비 화면으로 돌아가기</button>
            </div>
        </div>
    `;
}

function renderBestiary(audioBtn, transitionClass, bgImage) {
    const patternLabels = {
        random: '무작위로 공격합니다.',
        heavy_rock: '방패 강타를 자주 사용합니다.',
        heavy_scissors: '쌍검 베기를 자주 사용합니다.',
        heavy_paper: '마법 장막을 자주 사용합니다.',
        boss_golem: '세 번째 턴마다 강하게 버팁니다.',
        boss_swordsman: '쌍검 베기를 즐겨 쓰는 보스입니다.',
        boss_demon: '플레이어의 습관을 읽으려 합니다.',
        counter: '자주 쓰는 패를 노려 반격합니다.',
        rock_scissors: '방패와 쌍검을 섞어 사용합니다.',
        paper_scissors: '장막과 쌍검을 섞어 사용합니다.'
    };
    const listHtml = MONSTERS.map(m => {
        const unlocked = state.bestiary[m.id];
        const bestiaryText = m.desc || m.dialogue || patternLabels[m.pattern] || '아직 자세한 정보가 없습니다.';
        const patternText = patternLabels[m.pattern] || '특별한 패턴을 가졌습니다.';
        if (unlocked) {
            return `
            <div class="bg-slate-800/80 backdrop-blur-md p-4 rounded-3xl border-4 border-slate-500 flex flex-col gap-3 shadow-xl text-left min-h-[165px] hover:-translate-y-1 transition-transform">
                <div class="flex items-start gap-3">
                    <div class="emoji text-[48px] drop-shadow-xl shrink-0 leading-none">${m.icon}</div>
                    <div class="min-w-0 flex-1">
                        <h3 class="text-[22px] font-bold text-white mb-1 leading-snug break-keep">${m.name}</h3>
                        <p class="text-[15px] font-bold text-yellow-300 bg-slate-900/60 inline-block px-2.5 py-1 rounded-xl shadow-inner break-keep">기술: ${m.fav}</p>
                    </div>
                </div>
                <p class="text-[16px] text-slate-200 leading-snug text-balance drop-shadow-sm line-clamp-2">${bestiaryText}</p>
                <p class="text-[15px] text-blue-200 leading-snug bg-slate-900/50 px-3 py-2 rounded-xl border border-slate-600/70">특징: ${patternText}</p>
            </div>`;
        } else {
            return `
            <div class="bg-slate-900/80 backdrop-blur-md p-4 rounded-3xl border-4 border-slate-700 flex flex-col gap-3 shadow-lg opacity-50 text-left min-h-[165px]">
                <div class="flex items-start gap-3">
                    <div class="text-[48px] grayscale shrink-0 leading-none">❓</div>
                    <div class="w-full">
                        <h3 class="text-[22px] font-bold text-slate-500 mb-1 leading-snug">알 수 없는 몬스터</h3>
                        <p class="text-[16px] text-slate-600 mt-1 leading-snug">아직 조우하지 않았습니다.</p>
                    </div>
                </div>
            </div>`;
        }
    }).join('');

    return audioBtn + `
        <div class="w-full h-full flex flex-col items-center justify-center ${transitionClass} bg-cover bg-center relative" style="background-image: url('${bgImage}');">
            <div class="absolute inset-0 bg-slate-900/80 z-0"></div>
            <div class="z-10 relative flex flex-col h-full py-6 px-5 max-w-[1180px] mx-auto w-full">
                <h2 class="text-5xl text-purple-400 title-font mb-5 mt-1 text-center drop-shadow-md shrink-0">📖 전체 몬스터 도감</h2>
                <div class="flex-1 overflow-y-auto no-scrollbar grid grid-cols-3 gap-4 pb-3 min-h-0">
                    ${listHtml}
                </div>
                <button onclick="closeOverlay()" class="shrink-0 bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 px-8 rounded-3xl shadow-xl border-b-8 border-slate-800 active:border-b-0 active:mt-2 transition-all w-full text-3xl mt-4">닫기</button>
            </div>
        </div>
    `;
}

function renderAchievements(audioBtn, transitionClass, bgImage) {
    const achHtml = ACHIEVEMENTS_LIST.map(a => {
        const unlocked = state.achievements[a.id];
        return `
        <div class="bg-slate-800/80 backdrop-blur-md p-4 rounded-3xl border-4 ${unlocked ? 'border-yellow-500 shadow-yellow-500/20' : 'border-slate-600 opacity-50'} flex flex-col gap-3 shadow-xl text-left transition-all min-h-[165px]">
            <div class="flex items-start gap-3">
                <div class="text-[44px] drop-shadow-xl shrink-0 leading-none ${unlocked ? '' : 'grayscale'}">${unlocked ? '🏅' : '🔒'}</div>
                <div class="flex-1 min-w-0">
                    <h3 class="text-[22px] font-bold ${unlocked ? 'text-yellow-400' : 'text-slate-400'} mb-1 drop-shadow break-keep leading-snug">${a.name}</h3>
                </div>
                <div class="text-[16px] font-bold ${unlocked ? 'text-green-400' : 'text-slate-500'} shrink-0 self-start">
                    ${unlocked ? '달성' : '미달성'}
                </div>
            </div>
            <p class="text-[16px] text-slate-300 leading-snug text-balance drop-shadow-sm">${a.desc}</p>
        </div>`;
    }).join('');

    return audioBtn + `
        <div class="w-full h-full flex flex-col items-center justify-center ${transitionClass} bg-cover bg-center relative" style="background-image: url('${bgImage}');">
            <div class="absolute inset-0 bg-slate-900/80 z-0"></div>
            <div class="z-10 relative flex flex-col h-full py-6 px-5 max-w-[1180px] mx-auto w-full">
                <h2 class="text-5xl text-pink-400 title-font mb-5 mt-1 text-center drop-shadow-md shrink-0">🏅 업적 현황</h2>
                <div class="flex-1 overflow-y-auto no-scrollbar grid grid-cols-3 gap-4 pb-3 min-h-0">
                    ${achHtml}
                </div>
                <button onclick="closeOverlay()" class="shrink-0 bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 px-8 rounded-3xl shadow-xl border-b-8 border-slate-800 active:border-b-0 active:mt-2 transition-all w-full text-3xl mt-4">닫기</button>
            </div>
        </div>
    `;
}

function renderGameover(audioBtn, transitionClass, bgImage) {
    return audioBtn + `
        <div class="w-full h-full flex flex-col items-center justify-center ${transitionClass} bg-cover bg-center relative" style="background-image: url('${bgImage}');">
            <div class="absolute inset-0 bg-red-900/80 z-0"></div>
            <div class="z-10 relative flex flex-col items-center justify-center w-full px-6">
                <div class="text-[160px] mb-8 drop-shadow-2xl">💀</div>
                <h2 class="text-[80px] font-bold text-red-400 mb-8 title-font drop-shadow-lg text-center">게임 오버</h2>
                <p class="text-4xl text-yellow-300 font-bold mb-14 bg-slate-900/80 px-10 py-5 rounded-3xl border-4 border-red-500 shadow-2xl text-center">최종 도달: STAGE ${state.stage + 1}</p>
                
                <div class="flex flex-row gap-6 w-full max-w-4xl justify-center">
                    ${!state.rouletteUsed ? `<button onclick="useRoulette()" class="flex-1 bg-pink-600 hover:bg-pink-500 text-white font-bold py-8 px-10 rounded-3xl shadow-2xl border-b-8 border-pink-900 active:border-b-0 active:mt-2 transition-all text-4xl leading-tight">✨ 운명의 룰렛<br><span class="text-xl">(선생님 찬스!)</span></button>` : ''}
                    <button onclick="restartGame()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-8 px-10 rounded-3xl shadow-2xl border-b-8 border-slate-900 active:border-b-0 active:mt-2 transition-all text-4xl flex items-center justify-center">처음부터 다시 시작하기</button>
                </div>
            </div>
        </div>
    `;
}

function renderEnding(audioBtn, transitionClass, endingBg) {
    const completedAchievements = Object.values(state.achievements || {}).filter(v => v === true).length;
    const totalAchievements = ACHIEVEMENTS_LIST.length;
    const heroImg = state.player && state.player.cls ? state.player.cls.imgPrefix : 'sword';
    const heroName = state.player && state.player.cls ? state.player.cls.name : '가위바위보 히어로';
    const level = state.player && state.player.level ? state.player.level : 1;
    const gold = state.player && typeof state.player.gold === 'number' ? state.player.gold : 0;
    const augCount = state.player && Array.isArray(state.player.augments) ? state.player.augments.length : 0;
    const mobilePortrait = isMobilePortraitMode();
    const endingHeroesImg = './assets_ending/ending_heroes.png';

    if (mobilePortrait) {
        return audioBtn + `
            <div class="w-full h-full bg-black relative overflow-hidden ${transitionClass}">
                <div class="absolute inset-0 bg-cover bg-center opacity-55" style="background-image: url('${endingBg}');"></div>
                <div class="absolute inset-0 bg-slate-950/70"></div>
                <div class="relative z-10 h-full flex flex-col items-center justify-center px-8 py-10 text-center">
                    <img onerror="this.onerror=null; this.style.display='none';" src="${endingHeroesImg}" class="mx-auto max-h-[220px] w-auto object-contain drop-shadow-2xl mb-3" alt="엔딩 히어로">
                    <h2 class="text-[46px] text-yellow-300 font-bold title-font leading-tight drop-shadow-lg mb-4">왕국을 구했다!</h2>
                    <p class="text-[24px] text-slate-100 font-bold leading-relaxed mb-5 break-keep">세 힘의 균형이 돌아왔고,<br>사람들은 오늘의 히어로를 기억했습니다.</p>
                    <h1 class="text-[64px] text-white font-bold title-font leading-none drop-shadow-lg mb-5">THE END</h1>
                    <div class="bg-slate-900/80 border-4 border-slate-500 rounded-[2rem] p-6 w-full max-w-[620px] shadow-2xl backdrop-blur-md">
                        <img onerror="this.onerror=null; this.style.display='none';" src="./assets_hero/${heroImg}_idle.png" class="mx-auto border-4 border-slate-500 rounded-3xl bg-white shadow-xl object-cover w-[130px] h-[130px] mb-4" style="image-rendering: pixelated;" alt="Player">
                        <p class="text-green-300 text-[34px] font-bold title-font mb-3">최종 결과</p>
                        <div class="grid grid-cols-2 gap-3 text-[21px] font-bold text-slate-100 text-left">
                            <p class="bg-slate-800/80 rounded-xl p-3 col-span-2 text-center">히어로: <span class="text-white">${heroName}</span></p>
                            <p class="bg-slate-800/80 rounded-xl p-3">Lv.${level}</p>
                            <p class="bg-slate-800/80 rounded-xl p-3 text-yellow-300">${gold} G</p>
                            <p class="bg-slate-800/80 rounded-xl p-3 text-purple-300">증강 ${augCount}</p>
                            <p class="bg-slate-800/80 rounded-xl p-3 text-pink-300">업적 ${completedAchievements}/${totalAchievements}</p>
                        </div>
                    </div>
                    <button onclick="restartGame()" class="mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-5 px-12 rounded-3xl shadow-2xl border-b-8 border-blue-800 active:border-b-0 active:mt-8 transition-all text-[30px]">타이틀로 돌아가기</button>
                </div>
            </div>
        `;
    }

    return audioBtn + `
        <div class="w-full h-full bg-black relative overflow-hidden ${transitionClass}">
            <div class="absolute inset-0 bg-cover bg-center opacity-60" style="background-image: url('${endingBg}');"></div>
            <div class="absolute inset-0 bg-slate-950/65 z-0"></div>
            <div class="z-10 relative h-full w-full flex flex-col items-center justify-center px-10 py-6 text-center">
                <img onerror="this.onerror=null; this.style.display='none';" src="${endingHeroesImg}" class="mx-auto max-h-[170px] w-auto object-contain drop-shadow-2xl mb-2" alt="엔딩 히어로">
                <h2 class="text-[50px] text-yellow-300 font-bold title-font leading-none mb-2 drop-shadow-lg">가위바위보 히어로 키우기</h2>
                <p class="text-[22px] text-slate-100 leading-relaxed font-bold mb-1 drop-shadow break-keep">마지막 승부가 끝나고, 왕국의 시간이 다시 흐르기 시작했다.</p>
                <p class="text-[20px] text-slate-200 leading-relaxed mb-2 drop-shadow break-keep">가위는 길을 열고, 바위는 왕국을 지키고, 보는 모두를 감싸 안았다.</p>
                <p class="text-[32px] text-yellow-300 font-bold title-font leading-tight mb-2 drop-shadow-lg break-keep">당신은 진정한 가위바위보 히어로입니다.</p>
                <h1 class="text-[68px] text-white font-bold title-font leading-none mb-3 drop-shadow-lg">THE END</h1>
                
                <div class="bg-slate-900/80 p-5 rounded-3xl border-4 border-slate-600 shadow-2xl flex flex-row items-center justify-center gap-6 mb-5 text-left max-w-[780px] w-full backdrop-blur-md">
                    <img onerror="this.onerror=null; this.style.display='none';" src="./assets_hero/${heroImg}_idle.png" class="border-4 border-slate-500 rounded-3xl shrink-0 bg-white shadow-xl object-cover w-[130px] h-[130px]" style="image-rendering: pixelated;" alt="Player">
                    <div class="text-[22px] font-bold text-slate-200 w-full">
                        <p class="text-green-300 text-[34px] mb-3 title-font">최종 결과</p>
                        <div class="grid grid-cols-2 gap-x-5 gap-y-2">
                            <p>히어로: <span class="text-white">${heroName}</span></p>
                            <p>최종 레벨: <span class="text-white">Lv.${level}</span></p>
                            <p>보유 골드: <span class="text-yellow-400">${gold} G</span></p>
                            <p>수집 증강: <span class="text-purple-300">${augCount} 개</span></p>
                            <p class="col-span-2">달성 업적: <span class="text-pink-400">${completedAchievements} / ${totalAchievements}</span></p>
                        </div>
                    </div>
                </div>
                <button onclick="restartGame()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-14 rounded-3xl shadow-2xl border-b-8 border-blue-800 active:border-b-0 active:mt-2 transition-all text-[30px]">타이틀로 돌아가기</button>
            </div>
        </div>
    `;
}

function render() {
    const container = $('game-container');
    const currentRegionObj = REGIONS.find(r => r.id === state.currentRegion) || REGIONS[0];
    const bgImage = './assets_bg/' + currentRegionObj.bg;
    const titleBg = './assets_bg/bg_title.png'; 
    const endingBg = './assets_bg/bg_title.png'; 
    
    const audioBtn = `<button onclick="AudioEngine.toggle()" class="absolute top-6 right-8 z-50 text-5xl bg-slate-800/80 backdrop-blur-sm border-4 border-slate-600 rounded-full p-4 shadow-xl hover:bg-slate-700 active:scale-95 transition-all focus:outline-none">${AudioEngine.muted ? '🔇' : '🔊'}</button>`;

    let transitionClass = '';
    if (state.lastRenderedScreen !== state.screen) {
        transitionClass = 'fade-in'; 
        state.lastRenderedScreen = state.screen;
    }

    switch(state.screen) {
        case 'title': container.innerHTML = renderTitle(audioBtn, transitionClass, titleBg); break;
        case 'prologue': container.innerHTML = renderPrologue(audioBtn, transitionClass, titleBg); break;
        case 'difficultySelect': container.innerHTML = renderDifficulty(audioBtn, transitionClass, titleBg); break;
        case 'classSelect': container.innerHTML = renderClassSelect(audioBtn, transitionClass, titleBg); break;
        case 'regionIntro': container.innerHTML = renderRegionIntro(audioBtn, transitionClass, bgImage, currentRegionObj); break;
        case 'tacticSelect': container.innerHTML = renderTacticSelect(audioBtn, transitionClass, bgImage); break;
        case 'battle': container.innerHTML = renderBattle(audioBtn, transitionClass, bgImage); break;
        case 'augmentSelect': container.innerHTML = renderAugmentSelect(audioBtn, transitionClass, bgImage); break;
        case 'victory': container.innerHTML = renderVictory(audioBtn, transitionClass, bgImage); break;
        case 'shop': container.innerHTML = renderShop(audioBtn, transitionClass, bgImage); break;
        case 'bestiary': container.innerHTML = renderBestiary(audioBtn, transitionClass, bgImage); break;
        case 'achievements': container.innerHTML = renderAchievements(audioBtn, transitionClass, bgImage); break;
        case 'gameover': container.innerHTML = renderGameover(audioBtn, transitionClass, bgImage); break;
        case 'ending': container.innerHTML = renderEnding(audioBtn, transitionClass, endingBg); break;
    }
    requestAnimationFrame(adjustScale);
}

// 초기화
window.onload = () => { 
    render();
    requestAnimationFrame(adjustScale);
};
</script>
</body>
</html>
