// --- 화면 스케일링 (1280x720 비율 고정, 한 화면에 꽉 차게) ---
function adjustScale() {
    const container = document.getElementById('game-container');
    if (!container) return;

    const winW = window.innerWidth;
    const winH = window.innerHeight;
    const targetW = 1280;
    const targetH = 720;
    
    // 가로/세로 중 더 많이 축소해야 하는 비율을 선택해 화면 안에 무조건 핏(Fit) 되게 처리
    let scale = Math.min(winW / targetW, winH / targetH);
    
    // PC에서는 최대 크기(1280x720) 제한
    if (scale > 1) scale = 1; 

    container.style.transform = `scale(${scale})`;
}

window.addEventListener('resize', adjustScale);
window.addEventListener('orientationchange', () => {
    setTimeout(adjustScale, 100);
    setTimeout(adjustScale, 300);
});

// --- 세이브 & 로드 (LocalStorage) ---
function saveGame() {
    localStorage.setItem('rpsRPG_save', JSON.stringify(state));
}

function loadGame() {
    const saved = localStorage.getItem('rpsRPG_save');
    if (saved) {
        state = JSON.parse(saved);
        state.lastRenderedScreen = ''; 
        AudioEngine.init();
        
        // 로드된 화면에 맞는 BGM 재생
        if (state.screen === 'ending') {
            AudioEngine.playBGM('ending');
        } else if (['title', 'prologue', 'difficultySelect', 'classSelect'].includes(state.screen)) {
            AudioEngine.playBGM('title');
        } else {
            AudioEngine.playBGM(`stage${state.currentRegion}`);
        }
        render();
    }
}

// --- 오디오 매니저 (MP3 배경음악 + 8비트 효과음) ---
const AudioEngine = {
    ctx: null, 
    muted: true, 
    currentTrack: '', 
    bgmAudio: new Audio(), // HTML5 Audio 객체 사용
    
    init() {
        if(!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.muted = false;
            this.bgmAudio.loop = true; // BGM 무한 반복
            this.playBGM('title');
        } else if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },
    toggle() {
        this.muted = !this.muted;
        if(this.muted) { 
            this.bgmAudio.pause();
        } else { 
            if (this.currentTrack) {
                this.bgmAudio.play().catch(e => console.log("Audio play error:", e));
            }
        }
        render();
    },
    playBGM(trackName) {
        if (this.currentTrack === trackName) return; // 이미 같은 곡이 재생 중이면 무시
        this.currentTrack = trackName;
        
        let src = '';
        if (trackName === 'title') src = './assets_audio/bgm_title.mp3';
        else if (trackName === 'stage1') src = './assets_audio/bgm_stage1.mp3';
        else if (trackName === 'stage2') src = './assets_audio/bgm_stage2.mp3';
        else if (trackName === 'stage3') src = './assets_audio/bgm_stage3.mp3';
        else if (trackName === 'stage4') src = './assets_audio/bgm_stage4.mp3';
        else if (trackName === 'stage5') src = './assets_audio/bgm_stage5.mp3';
        else if (trackName === 'ending') src = './assets_audio/bgm_end.mp3';
        
        this.bgmAudio.src = src;
        
        if (!this.muted) {
            this.bgmAudio.play().catch(e => console.log("Audio play error:", e));
        }
    },
    playTone(freq, type, duration, vol=0.1) {
        // 기존 타격음, 효과음 로직 유지
        if(!this.ctx || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    sfx: {
        hit() { AudioEngine.playTone(150, 'sawtooth', 0.2, 0.15); },
        heal() { AudioEngine.playTone(600, 'sine', 0.2, 0.1); setTimeout(()=>AudioEngine.playTone(800, 'sine', 0.3, 0.1), 100); },
        coin() { AudioEngine.playTone(1200, 'square', 0.1, 0.05); setTimeout(()=>AudioEngine.playTone(1600, 'square', 0.2, 0.05), 100); },
        win() { [400, 500, 600, 800].forEach((f,i)=>setTimeout(()=>AudioEngine.playTone(f, 'square', 0.2, 0.1), i*150)); },
        lose() { [300, 250, 200, 150].forEach((f,i)=>setTimeout(()=>AudioEngine.playTone(f, 'sawtooth', 0.3, 0.15), i*200)); },
        select() { AudioEngine.playTone(400, 'sine', 0.1, 0.05); }
    }
};

const $ = (id) => document.getElementById(id);

function showFloatingText(target, text, colorClass) {
    const id = Date.now() + Math.random();
    state.floatingTexts.push({ id, target, text, colorClass });
    setTimeout(() => {
        const lenBefore = state.floatingTexts.length;
        state.floatingTexts = state.floatingTexts.filter(f => f.id !== id);
        if (lenBefore !== state.floatingTexts.length && !state.isAnimating) {
            render();
        }
    }, 1000);
}

function addLog(msg, type='normal') {
    const colors = { 'normal': 'text-slate-300', 'good': 'text-green-400 font-bold', 'bad': 'text-red-400 font-bold', 'info': 'text-yellow-300', 'aug': 'text-purple-400 font-bold' };
    state.log.unshift(`<span class="${colors[type]}">${msg}</span>`);
    if(state.log.length > 30) state.log.pop();
}

function hasAug(id) { return state.player.augments.some(a => a.id === id); }

function unlockAchievement(id) {
    if (!state.achievements[id]) {
        state.achievements[id] = true;
        const ach = ACHIEVEMENTS_LIST.find(a => a.id === id);
        addLog(`🏆 업적 달성: ${ach.name}`, 'good');
        showFloatingText('player', '업적 달성!', 'text-yellow-400 drop-shadow-md');
    }
}

function determineMonsterMove() {
    const mon = state.monster;
    let move = ['scissors', 'rock', 'paper'][Math.floor(Math.random() * 3)];
    let disabledMove = null;
    
    if (state.monsterStatus && state.monsterStatus.type === 'sealed') {
        disabledMove = state.monsterStatus.move;
        while (move === disabledMove) move = ['scissors', 'rock', 'paper'][Math.floor(Math.random() * 3)];
    }

    if (mon.pattern === 'boss_golem' && state.turnCount % 3 === 2) move = Math.random() < 0.9 ? 'rock' : move;
    else if (mon.pattern === 'boss_swordsman') move = Math.random() < 0.7 ? 'scissors' : move;
    else if (mon.pattern === 'boss_demon') {
        const hist = state.player.history;
        if (hist.length >= 2 && hist[hist.length-1] === hist[hist.length-2] && Math.random() < 0.8) {
            const last = hist[hist.length-1];
            move = last === 'rock' ? 'paper' : (last === 'paper' ? 'scissors' : 'rock');
        } else if (Math.random() < 0.4) {
            let fav = 'rock';
            if(state.player.stats.scissors > state.player.stats.rock) fav = 'scissors';
            if(state.player.stats.paper > Math.max(state.player.stats.rock, state.player.stats.scissors)) fav = 'paper';
            move = fav === 'rock' ? 'paper' : (fav === 'paper' ? 'scissors' : 'rock');
        }
    }
    else if (mon.pattern === 'heavy_rock' && Math.random() < 0.6) move = 'rock';
    else if (mon.pattern === 'heavy_paper' && Math.random() < 0.6) move = 'paper';
    else if (mon.pattern === 'heavy_scissors' && Math.random() < 0.6) move = 'scissors';
    else if (mon.pattern === 'counter' && Math.random() < 0.5) {
        let fav = 'rock';
        if(state.player.stats.scissors > state.player.stats.rock) fav = 'scissors';
        if(state.player.stats.paper > Math.max(state.player.stats.rock, state.player.stats.scissors)) fav = 'paper';
        move = fav === 'rock' ? 'paper' : (fav === 'paper' ? 'scissors' : 'rock');
    }
    
    if (disabledMove && move === disabledMove) {
        const remaining = ['scissors', 'rock', 'paper'].filter(m => m !== disabledMove);
        move = remaining[Math.floor(Math.random() * remaining.length)];
    }
    state.monsterNextMove = move;
}

function selectClass(classId) {
    AudioEngine.sfx.select();
    const cls = CLASSES[classId];
    state.player = {
        cls: cls, hp: cls.baseHp, maxHp: cls.baseHp, energy: 0, maxEnergy: 5, atk: cls.baseAtk, level: 1, exp: 0, gold: 50, revives: 0,

        buff: null, nextBuff: null, activeBuff: null, augments: [], seenAugments: [], consecutiveWins: 0, consecutiveDraws: 0, history: [], tactic: null, tacticUsed: false, firstDmgTaken: false,
        equipLevel: { weapon: 0, armor: 0, accessory: 0 }, animState: 'idle'
    };
    
    if(state.difficulty === 'easy') {
        state.player.maxHp += 20;
        state.player.hp += 20;
        state.player.gold += 50; 
    }
    
    state.stage = 0; state.log = []; state.bestiary = {}; state.floatingTexts = []; state.rouletteUsed = false; state.isAnimating = false;
    addLog(`${cls.name}로 모험을 시작합니다!`, 'info');
    checkRegionStart();
}

function checkRegionStart() {
    if (state.stage === 0) { state.screen = 'regionIntro'; state.currentRegion = 1; }
    else if (state.stage === 4) { state.screen = 'regionIntro'; state.currentRegion = 2; }
    else if (state.stage === 8) { state.screen = 'regionIntro'; state.currentRegion = 3; }
    else if (state.stage === 12) { state.screen = 'regionIntro'; state.currentRegion = 4; }
    else if (state.stage === 16) { state.screen = 'regionIntro'; state.currentRegion = 5; }
    else { startTacticSelect(); return; }
    
    const trackIdx = state.currentRegion >= 4 ? 3 : state.currentRegion - 1; 
    AudioEngine.playBGM(`stage${state.currentRegion}`);
    render();
}

function startTacticSelect() {
    AudioEngine.sfx.select();
    state.offeredTacticsOptions = TACTICS.sort(() => 0.5 - Math.random()).slice(0, 3);
    state.monster = MONSTERS[state.stage];
    state.bestiary[state.monster.id] = true;
    state.screen = 'tacticSelect';
    render();
}

function chooseTactic(tacticId) {
    if (state.isAnimating) return;
    AudioEngine.sfx.select();
    state.player.tactic = tacticId;
    state.player.tacticUsed = false;
    startBattle();
}

function startBattle() {
    state.monsterHp = state.monster.hp;
    state.screen = 'battle';
    state.player.buff = null;
    state.turnCount = 0;
    state.player.consecutiveWins = 0;
    state.player.consecutiveDraws = 0;
    state.monsterStatus = null;
    state.player.firstDmgTaken = false;
    state.crystalHintActive = false;
    state.player.animState = 'idle';
    state.isAnimating = false;
    state.floatingTexts = [];
    
    state.player.activeBuff = state.player.nextBuff;
    state.player.nextBuff = null;
    
    addLog(`STAGE ${state.stage + 1}: ${state.monster.name} 등장!`, 'bad');
    addLog(`"${state.monster.dialogue}"`, 'normal');
    
    // 소비 아이템 자동 사용
    if (state.player.inventory.candy > 0) {
        state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 2);
        state.player.inventory.candy--; addLog(`🍬 집중의 사탕: 기력 +2`, 'info');
    }
    if (state.player.inventory.bomb > 0) {
        state.monsterHp -= 25;
        showFloatingText('monster', '-25', 'text-red-500 drop-shadow-md');
        state.player.inventory.bomb--; addLog(`💣 고블린 폭탄: 적에게 25 피해!`, 'good');
    }
    if (state.player.inventory.flash > 0) {
        state.monsterStatus = { type: 'stunned', duration: 1 };
        state.player.inventory.flash--; addLog(`💥 섬광탄: 적이 1턴 기절합니다!`, 'good');
    }
    if (state.player.inventory.crystal > 0) {
        state.crystalHintActive = true;
    }

    if (state.player.activeBuff === 'atk_boost') addLog(`🐯 [호랑이 기운] 이번 전투 공격력 1.5배!`, 'info');
    if (state.player.activeBuff === 'thorns_aura') addLog(`🌵 [가시 오라] 반사 피해 +5 활성화!`, 'info');
    if (state.player.activeBuff === 'mana_surge') addLog(`⚡ [마력 폭주] 스킬 기력 소모 0!`, 'info');

    if (hasAug('aug_heavy')) { state.player.energy = 0; addLog(`🐢 무거운 갑옷: 시작 기력이 0이 됩니다.`, 'info'); }
    if (hasAug('aug_greed')) { 
        let g = Math.floor(Math.random() * 11) + 5; 
        state.player.gold += g; addLog(`🏺 탐욕의 항아리: ${g} 골드 획득!`, 'aug'); 
    }
    if (hasAug('aug_survival') && state.player.hp <= state.player.maxHp * 0.5) {
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 20); 
        showFloatingText('player', '+20', 'text-green-400 drop-shadow-md');
        addLog(`🍖 생존 본능: 체력 20 회복!`, 'aug');
    }
    
    if (state.player.tactic === 'reckless') { state.player.energy = 0; addLog("🔥 무모한 돌진: 기력이 0이 됩니다.", 'info'); }
    if (state.player.tactic === 'meditate') { state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 2); addLog("🧘 명상: 시작 기력 +2", 'info'); }
    if (state.player.tactic === 'sacrifice') { 
        state.player.hp = Math.max(1, state.player.hp - 5); 
        showFloatingText('player', '-5', 'text-red-500 drop-shadow-md');
        addLog("🩸 혈투: 시작 체력 -5", 'bad'); 
    }
    if (state.player.tactic === 'lucky') { 
        if(Math.random() < 0.5) { state.player.energy = state.player.maxEnergy; addLog("🍀 행운의 동전: 기력 MAX!", 'good'); } 
        else { addLog("🍀 행운의 동전: 꽝!", 'info'); } 
        state.player.tacticUsed = true; 
    }
    if (state.player.tactic === 'iron') { 
        state.player.hp = Math.max(1, state.player.hp - 3); 
        showFloatingText('player', '-3', 'text-red-500 drop-shadow-md');
        addLog("🧱 단단한 피부: 시작 체력 -3", 'bad'); 
    }
    if (state.player.tactic === 'observe') { state.player.tacticUsed = true; }
    
    determineMonsterMove();
    render();
}

function openShop() { AudioEngine.sfx.select(); state.screen = 'shop'; render(); }
function openBestiary() { AudioEngine.sfx.select(); state.screen = 'bestiary'; render(); }
function openAchievements() { AudioEngine.sfx.select(); state.screen = 'achievements'; render(); }
function closeOverlay() { AudioEngine.sfx.select(); state.screen = state.stage >= MONSTERS.length ? 'ending' : 'victory'; render(); }
function changeShopTab(tab) { AudioEngine.sfx.select(); state.shopTab = tab; render(); }

function useRoulette() {
    AudioEngine.sfx.heal();
    state.rouletteUsed = true;
    state.player.hp = 10;
    state.screen = 'battle';
    addLog("✨ 선생님 찬스! 기적적으로 체력 10으로 부활했습니다!", 'good');
    showFloatingText('player', '+10', 'text-green-400 drop-shadow-md');
    render();
}

function upgradeEquip(type) {
    if (state.isAnimating) return;
    let currentLv = state.player.equipLevel[type];
    let nextUpgrade = UPGRADES[type][currentLv];
    
    if (nextUpgrade && state.player.gold >= nextUpgrade.price) {
        AudioEngine.sfx.coin();
        state.player.gold -= nextUpgrade.price;
        
        let prevUpgrade = currentLv > 0 ? UPGRADES[type][currentLv - 1] : null;
        let diffAtk = (nextUpgrade.atk || 0) - (prevUpgrade ? (prevUpgrade.atk || 0) : 0);
        let diffHp = (nextUpgrade.hp || 0) - (prevUpgrade ? (prevUpgrade.hp || 0) : 0);
        let diffEn = (nextUpgrade.energy || 0) - (prevUpgrade ? (prevUpgrade.energy || 0) : 0);

        if(diffAtk) state.player.atk += diffAtk;
        if(diffHp) { state.player.maxHp += diffHp; state.player.hp += diffHp; }
        if(diffEn) state.player.maxEnergy += diffEn;
        
        state.player.equipLevel[type]++;
        
        if(state.player.equipLevel[type] >= 4) {
            unlockAchievement('maxUpgrade');
        }
        
        saveGame();
        let msgEl = $('shop-msg');
        if(msgEl) {
            msgEl.innerText = `${nextUpgrade.name} 업그레이드 완료!`;
            msgEl.classList.remove('fade-in'); void msgEl.offsetWidth; msgEl.classList.add('fade-in');
            setTimeout(() => { if($('shop-msg')) $('shop-msg').innerText = ''; }, 2000);
        }
        render();
    }
}

function buyItem(itemId, tab) {
    if (state.isAnimating) return;
    const item = SHOP_ITEMS[tab].find(i => i.id === itemId);
    if (state.player.gold >= item.price) {
        AudioEngine.sfx.coin();
        state.player.gold -= item.price;
        let msgStr = `${item.name} 구매 완료!`;
        const res = item.action(state.player);
        if(res) msgStr = res; 
        if(tab === 'buff') item.bought = true; 

        saveGame();
        render(); 
        const msgEl = $('shop-msg');
        if(msgEl) {
            msgEl.innerText = msgStr;
            msgEl.classList.remove('fade-in'); void msgEl.offsetWidth; msgEl.classList.add('fade-in');
            setTimeout(() => { if($('shop-msg')) $('shop-msg').innerText = ''; }, 2000);
        }
    }
}

function useSkill() {
    if (state.isAnimating) return;
    AudioEngine.sfx.select();
    const cost = state.player.activeBuff === 'mana_surge' ? 0 : 3;
    if (state.player.energy < cost) { addLog("기력이 부족합니다!", 'bad'); render(); return; }
    
    state.player.energy -= cost;
    const cid = state.player.cls.id;
    if (cid === 'scissors') { state.player.buff = 'double_dmg'; addLog("⚔️ 연속 베기! (승리 시 피해 2배)", 'info'); }
    else if (cid === 'rock') { state.player.buff = 'shield'; addLog("🛡️ 철벽 방어! (피해 무효화)", 'info'); }
    else if (cid === 'paper') { 
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 20); AudioEngine.sfx.heal(); 
        showFloatingText('player', '+20', 'text-green-400 drop-shadow-md');
        addLog("✨ 치유의 종이학! 체력 20 회복.", 'good'); 
    }
    
    if (hasAug('aug_meditation')) {
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 15);
        showFloatingText('player', '+15', 'text-green-400 drop-shadow-md');
        addLog("🧘 명상 효과로 추가 15 체력 회복!", 'aug');
    }
    render();
}

function playTurn(playerMove) {
    if (state.isAnimating || state.player.hp <= 0 || state.monsterHp <= 0) return;
    state.isAnimating = true;

    if(state.turnCount === 0 && state.crystalHintActive) {
        state.player.inventory.crystal--;
        state.crystalHintActive = false;
    }

    state.turnCount++;
    state.player.stats[playerMove]++;
    state.player.history.push(playerMove);
    if(state.player.history.length > 5) state.player.history.shift();
    
    if (hasAug('aug_lucky') && Math.random() < 0.2) { state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 1); addLog("🍀 행운: 기력 +1!", 'aug'); }
    if (hasAug('aug_last') && state.turnCount >= 5) { 
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 3); 
        showFloatingText('player', '+3', 'text-green-400 drop-shadow-md');
        addLog("⏳ 장기전: 체력 +3!", 'aug'); 
    }

    const monMove = state.monsterNextMove;
    const pName = MOVES[playerMove].name;
    const mName = MOVES[monMove].name;
    
    if (state.monster.pattern === 'boss_golem' && state.turnCount % 3 === 1) addLog("⚠️ 골렘이 굳건한 방어 태세를 준비합니다!", 'bad');

    addLog(`나: ${pName} VS 적: ${mName}`);
    
    let result = 0; 
    if (playerMove === monMove) result = 0;
    else if ((playerMove === 'scissors' && monMove === 'paper') || (playerMove === 'rock' && monMove === 'scissors') || (playerMove === 'paper' && monMove === 'rock')) result = 1;
    else result = -1;

    if (result === -1 && state.player.inventory.cloak > 0) {
        result = 0; state.player.inventory.cloak--; addLog("🥷 망토 발동! 무승부로 회피.", 'info');
    }
    if (state.monsterStatus && state.monsterStatus.type === 'stunned') {
        addLog("적은 기절해서 움직일 수 없다!", 'good');
        if (result === -1) result = 0;
    }

    let lastTurnWasLoss = (state.player.lastResult === -1);
    state.player.lastResult = result;
    
    let tUsed = state.player.tacticUsed;
    let tactic = state.player.tactic;

    if (result === 1) { 
        state.player.animState = 'attack';
        AudioEngine.sfx.hit();
        state.player.consecutiveWins++;
        state.player.consecutiveDraws = 0;
        let dmg = state.player.atk;
        
        if (!tUsed) {
            if (tactic === 'ambush') { dmg += 3; addLog("🔪 기습 성공! 피해 +3", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'reckless') { dmg += 5; addLog("🔥 무모한 돌진! 피해 +5", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'vampire') { 
                state.player.hp = Math.min(state.player.maxHp, state.player.hp + 5); 
                showFloatingText('player', '+5', 'text-green-400 drop-shadow-md');
                addLog("🧛 흡혈 태세! 체력 5 회복", 'good'); state.player.tacticUsed = true; 
            }
            else if (tactic === 'meditate') { dmg = Math.max(1, dmg - 2); addLog("🧘 명상 페널티: 피해 -2", 'bad'); state.player.tacticUsed = true; }
            else if (tactic === 'thief') { state.player.gold += 10; addLog("💰 소매치기 성공! 10 골드", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'sacrifice') { dmg += 6; addLog("🩸 혈투의 일격! 피해 +6", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'berserk') { dmg *= 2; addLog("😡 광전사의 일격! 피해 2배!", 'good'); state.player.tacticUsed = true; }
        }
        
        if (state.turnCount === 1 && hasAug('aug_first')) { dmg += 5; addLog("⚔️ 선봉장 효과! 피해 +5", 'aug'); }
        if (hasAug('aug_revenge') && lastTurnWasLoss) { dmg += 5; addLog("😠 복수심 폭발! 피해 +5", 'aug'); }

        if (state.player.cls.id === 'scissors') {
            if (playerMove === 'scissors') dmg += 3;
            if (state.player.consecutiveWins >= 3) { dmg *= 2; addLog("🌪️ 폭풍 베기! 피해 2배!", 'good'); }
        }
        if (state.player.cls.id === 'paper' && playerMove === 'paper') { state.monsterStatus = { type: 'sealed', move: monMove, duration: 1 }; addLog(`✋ 적의 행동 봉인!`, 'good'); }

        if (state.monster.pattern === 'boss_golem' && playerMove === 'paper' && state.turnCount % 3 === 2) { dmg *= 2; addLog("💥 치명타!", 'good'); }
        if (state.monster.pattern === 'boss_swordsman' && playerMove === 'rock') { state.monsterStatus = { type: 'stunned', duration: 1 }; addLog("💫 적 기절!", 'good'); }
        if (state.monster.pattern === 'boss_demon' && new Set(state.player.history.slice(-3)).size === 3) { dmg = Math.floor(dmg * 1.5); addLog("🌀 마왕 혼란! 피해 1.5배!", 'good'); }

        if (state.player.buff === 'double_dmg') { dmg *= 2; }
        if (state.player.activeBuff === 'atk_boost') dmg = Math.floor(dmg * 1.5);
        if (hasAug('aug_sc_dmg') && playerMove === 'scissors') dmg += 5;
        if (hasAug('aug_berserk') && state.player.hp <= state.player.maxHp * 0.3) { dmg = Math.floor(dmg * 1.5); addLog("😡 광전사! 피해 1.5배!", 'aug'); }

        state.monsterHp -= dmg;
        state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 1);
        
        let msg = `공격 성공! ${dmg} 피해!`;
        showFloatingText('monster', `-${dmg}`, 'text-white font-bold drop-shadow-[0_0_8px_rgba(239,68,68,1)] text-[40px]');

        if (dmg >= 50) { unlockAchievement('overkill'); }

        if (hasAug('aug_vampire')) { 
            state.player.hp = Math.min(state.player.maxHp, state.player.hp + 3); msg += ` 🩸 흡혈 +3`; 
            showFloatingText('player', '+3', 'text-green-400 drop-shadow-md');
        }
        if (hasAug('aug_combo') && state.player.consecutiveWins % 2 === 0) { state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 1); msg += ` 🥊 콤보 기력+1`; }
        addLog(msg, 'good');

        if (state.monsterHp < 0 && hasAug('aug_blood')) {
            const overDmg = Math.abs(state.monsterHp);
            state.player.hp = Math.min(state.player.maxHp, state.player.hp + overDmg);
            showFloatingText('player', `+${overDmg}`, 'text-green-400 drop-shadow-md');
            addLog(`🧛 초과 피해 흡수! 체력 ${overDmg} 회복`, 'aug');
        }

        if (hasAug('aug_focus') && state.player.consecutiveWins === 3) { state.player.energy = state.player.maxEnergy; addLog("🎯 3연승 기력 MAX!", 'aug'); state.player.consecutiveWins = 0; }
        
        if (state.player.consecutiveWins >= 3) { unlockAchievement('winStreak3'); }

        state.shakeTarget = 'monster';
        
    } else if (result === 0) { 
        state.player.animState = 'draw';
        AudioEngine.sfx.select();
        state.player.consecutiveWins = 0;
        state.player.consecutiveDraws++;
        let eGain = 2;
        if (hasAug('aug_energy')) eGain += 1;
        state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + eGain);
        
        if (!tUsed) {
            if (tactic === 'draw_heal') { 
                state.player.hp = Math.min(state.player.maxHp, state.player.hp + 5); 
                showFloatingText('player', '+5', 'text-green-400 drop-shadow-md');
                addLog("🩹 숨 고르기: 체력 5 회복", 'good'); state.player.tacticUsed = true; 
            }
            else if (tactic === 'draw_energy') { state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 2); addLog("⚡ 기 모으기: 기력 +2", 'good'); state.player.tacticUsed = true; }
        }

        let msg = `서로 부딪혔다! 무승부. (기력+${eGain})`;
        showFloatingText('monster', `무승부!`, 'text-blue-300 drop-shadow-md');

        if (state.player.cls.id === 'paper') { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 5); msg += ` 장막 회복+5`; showFloatingText('player','+5','text-green-400'); }
        if (hasAug('aug_pp_heal') && playerMove === 'paper') { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 7); msg += ` 🧻 마법 회복+7`; showFloatingText('player','+7','text-green-400');}
        if (hasAug('aug_stone') && playerMove === 'rock') { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 5); msg += ` 🗿 결의 회복+5`; showFloatingText('player','+5','text-green-400');}
        if (hasAug('aug_wind')) { state.monsterHp -= 3; msg += ` 🌪️ 칼바람 피해 3!`; state.shakeTarget = 'monster'; showFloatingText('monster','-3','text-red-400');}
        if (hasAug('aug_vital') && Math.random() < 0.5) { state.player.maxHp++; state.player.hp++; msg += ` 🍎 최대체력+1`; showFloatingText('player','+1','text-yellow-400');}

        if (state.monster.pattern === 'boss_demon') { state.monsterHp += 15; msg += ` 👿 마왕 체력 회복!`; showFloatingText('monster','+15','text-green-400');}
        addLog(msg, 'info');

        if (state.player.consecutiveDraws >= 5) { unlockAchievement('drawStreak5'); }
        
    } else { 
        state.player.animState = 'hit';
        AudioEngine.sfx.lose();
        state.player.consecutiveWins = 0;
        state.player.consecutiveDraws = 0;
        let dmg = state.monster.atk;
        
        if (!tUsed) {
            if (tactic === 'ambush') { dmg += 2; addLog("⚠️ 기습 실패: 피해 +2", 'bad'); state.player.tacticUsed = true; }
            else if (tactic === 'defend') { dmg = Math.max(1, dmg - 3); addLog("🛡️ 방어 태세: 피해 -3", 'info'); state.player.tacticUsed = true; }
            else if (tactic === 'reflect') { state.monsterHp -= 4; showFloatingText('monster','-4','text-red-400'); addLog("🪞 방패 치기: 적에게 4 피해 반사!", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'berserk') { dmg *= 2; addLog("😡 광전사 페널티: 피해 2배!", 'bad'); state.player.tacticUsed = true; }
            else if (tactic === 'iron') { dmg = 0; addLog("🧱 단단한 피부: 첫 피해 무효화!", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'scout') { dmg += 3; addLog("⚠️ 정찰 페널티: 피해 +3", 'bad'); state.player.tacticUsed = true; }
        }

        if (hasAug('aug_iron') && !state.player.firstDmgTaken) {
            dmg = 0; state.player.firstDmgTaken = true; addLog("🛡️ 무쇠 피부로 첫 피해를 막았습니다!", 'aug');
        } 
        else if (hasAug('aug_shadow') && state.player.hp <= 15 && Math.random() < 0.5) {
            dmg = 0; addLog("🌑 그림자 망토! 적의 공격을 회피했습니다!", 'aug');
        }
        else if (state.player.buff === 'shield') {
            dmg = 0; addLog("철벽 방어로 공격을 막아냈습니다!", 'good');
        } else {
            if (state.player.cls.id === 'rock' && state.player.hp <= state.player.maxHp * 0.3) dmg = Math.floor(dmg / 2);
            if (state.player.cls.id === 'rock' && playerMove === 'rock') dmg = Math.max(1, dmg - 3);
            if (hasAug('aug_rk_def') && playerMove === 'rock') dmg = Math.max(1, dmg - 4);
            if (hasAug('aug_mana_shield') && state.player.energy > 0) { state.player.energy--; dmg = Math.max(0, dmg - 5); addLog("💠 마나 실드: 기력 1소모, 피해 5 감소!", 'aug'); }
            if (state.monster.pattern === 'boss_swordsman' && playerMove === 'paper') dmg = Math.floor(dmg * 1.5);
        }
        
        state.player.hp -= dmg;
        state.player.firstDmgTaken = true;
        if(dmg > 0) {
            addLog(`적의 공격에 당했다... ${dmg} 피해!`, 'bad');
            showFloatingText('player', `-${dmg}`, 'text-red-500 drop-shadow-md text-[40px]');
        }

        let reflectDmg = 0;
        if (hasAug('aug_thorns') && dmg > 0) reflectDmg += 3;
        if (state.player.activeBuff === 'thorns_aura' && dmg > 0) reflectDmg += 5;
        if (hasAug('aug_mirror') && dmg >= 10) reflectDmg += 5;

        if (reflectDmg > 0) { 
            state.monsterHp -= reflectDmg; 
            showFloatingText('monster', `-${reflectDmg}`, 'text-red-400 drop-shadow-md');
            addLog(`💥 반사 효과로 적에게 ${reflectDmg} 피해!`, 'aug'); 
        }
        
        state.shakeTarget = 'player';
    }
    
    state.player.buff = null;
    if (state.monsterStatus) { state.monsterStatus.duration--; if (state.monsterStatus.duration <= 0) state.monsterStatus = null; }
    
    render(); 

    setTimeout(() => {
        state.player.animState = 'idle';
        state.shakeTarget = null;
        
        if (state.player.hp <= 0) {
            if (state.player.revives > 0) {
                state.player.revives--; state.player.hp = Math.floor(state.player.maxHp * 0.5); AudioEngine.sfx.heal();
                unlockAchievement('revived');
                addLog("✨ 부활의 십자가! 체력 50%로 부활!", 'good'); 
                showFloatingText('player', '부활!', 'text-yellow-400 drop-shadow-md');
                state.shakeTarget = 'player';
                state.isAnimating = false;
                render();
            } else { 
                state.screen = 'gameover'; AudioEngine.sfx.lose(); 
                state.isAnimating = false;
                render(); 
            }
        } else if (state.monsterHp <= 0) {
            processBattleVictory();
        } else {
            determineMonsterMove(); 
            state.isAnimating = false;
            render();
        }
    }, 1000); 
}

function processBattleVictory() {
    AudioEngine.sfx.win();

    if (state.player.hp === 1 && !state.achievements.survive1Hp) {
        state.achievements.survive1Hp = true;
        addLog("🏆 업적 달성: 기적의 생존자 달성!", 'good');
    }
    if (!state.player.firstDmgTaken) { unlockAchievement('perfectWin'); }

    let goldGain = state.monster.goldReward;
    if (hasAug('aug_rich')) goldGain += 15;
    if (hasAug('aug_gamble') && Math.random() < 0.2) { goldGain *= 2; addLog(`🎲 승부사: 골드 2배!`, 'aug'); }
    if (hasAug('aug_bounty') && [3,7,11,15,19].includes(state.stage)) { goldGain += 100; addLog(`🐉 드래곤 슬레이어: 보스 보상 +100G!`, 'aug'); }
    
    addLog(`전투 승리! ${state.monster.exp}EXP, 💰${goldGain} 골드 획득.`, 'good');
    state.player.exp += state.monster.exp;
    state.player.gold += goldGain;
    
    if (state.player.gold >= 300) { unlockAchievement('rich'); }

    if (state.player.exp >= state.player.level * 50) {
        state.player.level++; state.player.maxHp += 15; state.player.hp = state.player.maxHp; state.player.atk += 3;
        addLog(`🎉 레벨 업! Lv.${state.player.level} 달성!`, 'good');
    }
    
    state.player.activeBuff = null;
    SHOP_ITEMS.buff.forEach(i => i.bought = false);
    
    saveGame(); 

    state.stage++;
    if (state.stage >= MONSTERS.length) {
        state.screen = 'ending';
        AudioEngine.playBGM('ending');
    } else {
        let availableAugs = AUGMENTS.filter(a => !hasAug(a.id) && !state.player.seenAugments.includes(a.id));
        if (availableAugs.length < 3) {
            availableAugs = AUGMENTS.filter(a => !hasAug(a.id));
        }
        state.offeredAugments = availableAugs.sort(() => 0.5 - Math.random()).slice(0, 3);
        state.offeredAugments.forEach(a => { if(!state.player.seenAugments.includes(a.id)) state.player.seenAugments.push(a.id); });
        
        state.screen = 'augmentSelect';
    }
    state.isAnimating = false;
    render();
}

function selectAugment(augId) {
    if (state.isAnimating) return;
    AudioEngine.sfx.select();
    const aug = AUGMENTS.find(a => a.id === augId);
    state.player.augments.push(aug);
    if (aug.id === 'aug_giant') { state.player.maxHp += 20; state.player.hp += 20; }
    
    if (state.player.augments.length >= 7) { unlockAchievement('collector'); }
    
    saveGame();
    state.screen = 'victory';
    render();
}

function restartGame() {
    AudioEngine.sfx.select();
    state.screen = 'title';
    SHOP_ITEMS.buff.forEach(i => i.bought = false);
    AudioEngine.playBGM('title');
    render();
}

                <div class="z-10 relative max-w-4xl w-full text-center space-y-10 my-auto pb-10 mt-12">

                    <p class="text-3xl text-slate-200 leading-loose fade-in-slow" style="animation-delay: 1.5s; opacity: 0;">마지막 승부가 끝났다.</p>
                    <p class="text-3xl text-slate-200 leading-loose fade-in-slow" style="animation-delay: 3s; opacity: 0;">마왕의 그림자는 사라지고,<br>멈춰 있던 왕국의 시간이 다시 흐르기 시작했다.</p>
                    <div class="text-2xl text-slate-300 leading-loose fade-in-slow" style="animation-delay: 4.5s; opacity: 0;">
                        <p>가위는 다시 길을 열고,</p>
                        <p>바위는 다시 왕국을 지키고,</p>
                        <p>보는 다시 모두를 감싸 안았다.</p>
                    </div>
                    <p class="text-3xl text-slate-200 leading-loose fade-in-slow" style="animation-delay: 6s; opacity: 0;">세 힘의 균형은 되돌아왔다.<br>그리고 사람들은 그날의 히어로를 오래도록 기억했다.</p>
                    <p class="text-5xl text-yellow-400 font-bold title-font leading-loose fade-in-slow" style="animation-delay: 7.5s; opacity: 0;">당신은 진정한 가위바위보 히어로입니다.</p>
                    
                    <div class="fade-in-slow" style="animation-delay: 9s; opacity: 0;">
                        <h1 class="text-[100px] text-white font-bold title-font mt-12 mb-8 drop-shadow-lg">THE END</h1>
                        
                        <div class="bg-slate-800/80 p-10 rounded-3xl border-4 border-slate-600 shadow-2xl flex flex-row items-center justify-center gap-8 mb-8 text-left max-w-2xl mx-auto backdrop-blur-md">
                            <img src="./assets_hero/${state.player.cls.imgPrefix}_idle.png" class="border-4 border-slate-500 rounded-3xl shrink-0 bg-white shadow-xl object-cover w-[160px] h-[160px]" style="image-rendering: pixelated;" alt="Player">
                            <div class="text-2xl font-bold text-slate-200 space-y-4 w-full">
                                <p class="text-green-300 text-4xl mb-4 title-font">최종 결과</p>
                                <p>히어로: <span class="text-white">${state.player.cls.name}</span></p>
                                <p>최종 레벨: <span class="text-white">Lv.${state.player.level}</span></p>
                                <p>보유 골드: <span class="text-yellow-400">${state.player.gold} G</span></p>
                                <p>수집 증강: <span class="text-purple-300">${state.player.augments.length} 개</span></p>
                                <p>달성 업적: <span class="text-pink-400">${completedAchievements} / ${totalAchievements}</span></p>
                            </div>
                        </div>
                        <button onclick="restartGame()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-6 px-16 rounded-3xl shadow-2xl border-b-8 border-blue-800 active:border-b-0 active:mt-2 transition-all text-4xl">타이틀로 돌아가기</button>
                    </div>
                </div>
            </div>
        `;
    }
    
    container.innerHTML = html;
}

window.onload = () => { 
    adjustScale();
    render(); 
};
</script>
</body>
</html>
