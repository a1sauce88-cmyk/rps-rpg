           1. CSS 및 애니메이션 영역
        ========================================= */

        html, body {

            padding: 0;
            width: 100%;

        }

        body {
            font-family: 'Gowun Dodum', sans-serif;
            color: #f8fafc;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        h1, h2, h3, .title-font { font-family: 'Jua', sans-serif; }
        .emoji { font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; }
        
        /* 공통 애니메이션 */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }
        .anim-shake { animation: shake 0.3s ease-in-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }

        @keyframes slowFadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .fade-in-slow { opacity: 0; animation: slowFadeIn 2s ease-out forwards; }

        @keyframes float-up {
            0% { transform: translateY(0) scale(0.8); opacity: 1; font-weight: bold; }
            80% { opacity: 1; }
            100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
        }
        .anim-float { 
            animation: float-up 1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; 
            position: absolute; 
            pointer-events: none; 
            z-index: 50; 
        }

        @keyframes bounce-slow {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(5%); }
        }
        .anim-bubble { animation: bounce-slow 2s infinite ease-in-out; }

        /* UI 편의성 유틸리티 */
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .tab-inactive { background-color: rgba(51, 65, 85, 0.8); color: #94a3b8; border-color: #475569; }

        /* 세로 화면(Portrait) 강제 안내 오버레이 */
        #portrait-warning {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #0f172a;
            z-index: 999999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /*
           반응형 핵심 구조
           - transform: scale()로 전체 화면을 줄이면 텍스트가 이미지처럼 리샘플링되어 흐려질 수 있습니다.
           - 그래서 컨테이너는 flex로 중앙 정렬하고, 화면 맞춤은 CSS zoom을 우선 사용합니다.
           - zoom은 크기만 조정하고 텍스트 렌더링이 transform scale보다 선명하게 유지됩니다.
        */
        #main-wrapper {
            width: 100vw;
            height: 100dvh;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            place-items: center;

        #game-container {
            position: relative;

            height: 720px;

            transform: none;
            transform-origin: center center;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            flex-shrink: 0;
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* 가로 모드 강제: 세로 화면에서는 게임을 숨기고 회전 안내만 표시 */
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex !important; }

        }

        @media screen and (orientation: landscape) {
            #portrait-warning { display: none !important; }
            #main-wrapper { display: flex !important; align-items: center !important; justify-content: center !important; }

<script>
/* =========================================
   3. JAVASCRIPT 로직 및 데이터 영역
========================================= */

// --- 1. 화면 스케일링: 1280x720 기준 화면을 PC/태블릿/모바일 가로에 맞게 확대/축소 ---
const BASE_WIDTH = 1280;
const BASE_HEIGHT = 720;

function getViewportSize() {
    // 모바일 브라우저 주소창 변화까지 최대한 안정적으로 반영
    const viewport = window.visualViewport;
    return {
        width: viewport ? viewport.width : window.innerWidth,
        height: viewport ? viewport.height : window.innerHeight
    };
}

function isPortraitMode() {
    const { width, height } = getViewportSize();
    return height > width;
}

function isMobilePortraitMode() {
    // 기존 렌더 함수들이 참조하므로 이름은 유지합니다.
    // 이제 세로 UI를 따로 만들지 않고, 모든 세로 화면에서 회전 안내만 표시합니다.
    return isPortraitMode();
}

function adjustScale() {
    const container = document.getElementById('game-container');
    const wrapper = document.getElementById('main-wrapper');
    if (!container) return;

    const { width: winW, height: winH } = getViewportSize();
    const safeW = Math.max(1, winW);
    const safeH = Math.max(1, winH);

    // 게임 본편은 항상 1280x720 가로 캔버스를 기준으로 유지합니다.
    // 세로 화면에서는 CSS가 #main-wrapper를 숨기고 #portrait-warning만 보여줍니다.
    const baseW = BASE_WIDTH;
    const baseH = BASE_HEIGHT;

    container.style.width = `${baseW}px`;
    container.style.height = `${baseH}px`;
    container.style.left = 'auto';
    container.style.top = 'auto';
    container.style.position = 'relative';
    container.style.transformOrigin = 'center center';
    document.body.classList.toggle('mobile-portrait', false);

    if (wrapper) {
        wrapper.style.overflow = 'hidden';
        wrapper.style.display = 'flex';
        wrapper.style.alignItems = 'center';
        wrapper.style.justifyContent = 'center';
        wrapper.style.placeItems = 'center';
        wrapper.style.width = '100vw';
        wrapper.style.height = '100dvh';
    }

    // 화면 안에 16:9 게임 캔버스가 잘리지 않도록 여유값을 살짝 둡니다.
    const fit = Math.min(safeW / baseW, safeH / baseH) * 0.995;

    // Chrome/Edge/모바일 브라우저에서는 zoom이 텍스트 선명도에 유리합니다.
    // zoom 미지원 환경에서는 transform scale로 동일 비율을 보장합니다.
    if (window.CSS && CSS.supports && CSS.supports('zoom', '1')) {
        container.style.zoom = fit;
        container.style.transform = 'none';
    } else {
        container.style.zoom = '1';
        container.style.transform = `scale(${fit})`;
    }
}

function handleViewportChange() {
    adjustScale();
}

window.addEventListener('resize', handleViewportChange);
window.addEventListener('orientationchange', () => {
    setTimeout(handleViewportChange, 50);
    setTimeout(handleViewportChange, 250);
    setTimeout(handleViewportChange, 500);
});
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleViewportChange);
    window.visualViewport.addEventListener('scroll', adjustScale);
}

// --- 2. 오디오 매니저 ---
const AudioEngine = {
    ctx: null, 
    muted: true, 
    currentTrack: '', 
    bgmAudio: new Audio(),
    unlocked: false,

    init(forceUnmute = true) {
        try {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.bgmAudio.loop = true;
                this.bgmAudio.volume = 0.35;
                this.unlocked = true;
            }

            if (forceUnmute) this.muted = false;

            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume().catch(e => console.warn('AudioContext resume blocked:', e));
            }

            if (!this.currentTrack) {
                this.playBGM('title');
            } else if (!this.muted) {
                this.bgmAudio.play().catch(e => console.warn('Audio play blocked:', e));
            }
        } catch (e) {
            console.warn('Audio init failed:', e);
        }
    },

    ensureReady() {
        if (!this.ctx) this.init(true);
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(e => console.warn('AudioContext resume blocked:', e));
        }
    },

    toggle() {
        if (!this.ctx) {
            this.init(false);
        } else if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(e => console.warn('AudioContext resume blocked:', e));
        }

        this.muted = !this.muted;

        if (this.muted) {
            this.bgmAudio.pause();
        } else {
            if (!this.currentTrack) this.playBGM('title');
            else this.bgmAudio.play().catch(e => console.warn('Audio play blocked:', e));
            this.playTone(700, 'sine', 0.08, 0.08);
        }
        render();
    },

    playBGM(trackName) {
        const previousTrack = this.currentTrack;
        if (previousTrack === trackName && this.bgmAudio.src) {
            if (!this.muted) this.bgmAudio.play().catch(e => console.warn('Audio play blocked:', e));
            return;
        }

        this.currentTrack = trackName;
        
        let src = '';
        switch(trackName) {
            case 'title': src = './assets_audio/bgm_title.mp3'; break;
            case 'stage1': src = './assets_audio/bgm_stage1.mp3'; break;
            case 'stage2': src = './assets_audio/bgm_stage2.mp3'; break;
            case 'stage3': src = './assets_audio/bgm_stage3.mp3'; break;
            case 'stage4': src = './assets_audio/bgm_stage4.mp3'; break;
            case 'stage5': src = './assets_audio/bgm_stage5.mp3'; break;
            case 'ending': src = './assets_audio/bgm_end.mp3'; break;
        }

        this.bgmAudio.src = src;
        this.bgmAudio.volume = 0.35;
        if (!this.muted) this.bgmAudio.play().catch(e => console.warn('Audio play blocked:', e));
    },

    playTone(freq, type, duration, vol=0.18) {
        if (this.muted) return;
        if (!this.ctx) this.init(true);
        if (!this.ctx) return;

        if (this.ctx.state === 'suspended') {
            this.ctx.resume()
                .then(() => this.playTone(freq, type, duration, vol))
                .catch(e => console.warn('AudioContext resume blocked:', e));
            return;
        }

        try {
            const osc = this.ctx.createOscillator(); 
            const gain = this.ctx.createGain();
            osc.type = type; 
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain); 
            gain.connect(this.ctx.destination);
            osc.start(); 
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
            console.warn('SFX play failed:', e);
        }
    },

    sfx: {
        hit() { AudioEngine.playTone(150, 'sawtooth', 0.2, 0.22); },
        heal() { AudioEngine.playTone(600, 'sine', 0.2, 0.16); setTimeout(()=>AudioEngine.playTone(800, 'sine', 0.3, 0.16), 100); },
        coin() { AudioEngine.playTone(1200, 'square', 0.1, 0.12); setTimeout(()=>AudioEngine.playTone(1600, 'square', 0.2, 0.12), 100); },
        win() { [400, 500, 600, 800].forEach((f,i)=>setTimeout(()=>AudioEngine.playTone(f, 'square', 0.2, 0.16), i*150)); },
        lose() { [300, 250, 200, 150].forEach((f,i)=>setTimeout(()=>AudioEngine.playTone(f, 'sawtooth', 0.3, 0.22), i*200)); },
        select() { AudioEngine.playTone(500, 'sine', 0.12, 0.14); }
    }
};

// PC/모바일 브라우저의 자동재생 제한 때문에 첫 입력에서 오디오를 확실히 깨웁니다.
['pointerdown', 'keydown'].forEach(evt => {
    window.addEventListener(evt, () => {
        if (!AudioEngine.ctx) AudioEngine.init(true);
        else if (AudioEngine.ctx.state === 'suspended') AudioEngine.ctx.resume().catch(() => {});
    }, { once: true, passive: true });
});

    achievements: { winStreak3: false, survive1Hp: false, drawStreak5: false, maxUpgrade: false, perfectWin: false, overkill: false, rich: false, collector: false, revived: false },

};

function ensureStateDefaults() {
    if (!state || typeof state !== 'object') state = {};
    if (!state.player) state.player = {};
    if (typeof state.screen === 'undefined') state.screen = 'title';
    if (typeof state.difficulty === 'undefined') state.difficulty = 'normal';
    if (typeof state.stage !== 'number') state.stage = 0;
    state.stage = Math.max(0, Math.min(state.stage, MONSTERS.length - 1));
    if (typeof state.currentRegion !== 'number') state.currentRegion = Math.floor(state.stage / 4) + 1;
    if (typeof state.prophecyHintActive === 'undefined') state.prophecyHintActive = false;
    if (typeof state.crystalHintActive === 'undefined') state.crystalHintActive = false;
    if (typeof state.monsterHintText === 'undefined') state.monsterHintText = null;
    if (!Array.isArray(state.monsterMoveHistory)) state.monsterMoveHistory = [];
    if (!Array.isArray(state.log)) state.log = [];
    if (!Array.isArray(state.floatingTexts)) state.floatingTexts = [];
    if (!state.bestiary) state.bestiary = {};
    if (!Array.isArray(state.offeredAugments)) state.offeredAugments = [];
    if (!Array.isArray(state.offeredTacticsOptions)) state.offeredTacticsOptions = [];
    if (!state.achievements) state.achievements = { winStreak3: false, survive1Hp: false, drawStreak5: false, maxUpgrade: false, perfectWin: false, overkill: false, rich: false, collector: false, revived: false };

    if (!state.player.inventory) state.player.inventory = { crystal: 0, cloak: 0, candy: 0, bomb: 0, flash: 0 };
    state.player.inventory = Object.assign({ crystal: 0, cloak: 0, candy: 0, bomb: 0, flash: 0 }, state.player.inventory);
    if (!Array.isArray(state.player.augments)) state.player.augments = [];
    if (!Array.isArray(state.player.seenAugments)) state.player.seenAugments = [];
    if (!state.player.stats) state.player.stats = { scissors: 0, rock: 0, paper: 0 };
    if (!Array.isArray(state.player.history)) state.player.history = [];
    if (!state.player.equipLevel) state.player.equipLevel = { weapon: 0, armor: 0, accessory: 0 };
    if (typeof state.player.consecutiveWins === 'undefined') state.player.consecutiveWins = 0;
    if (typeof state.player.consecutiveDraws === 'undefined') state.player.consecutiveDraws = 0;
    if (typeof state.player.buff === 'undefined') state.player.buff = null;
    if (typeof state.player.activeBuff === 'undefined') state.player.activeBuff = null;
    if (typeof state.player.nextBuff === 'undefined') state.player.nextBuff = null;
    if (typeof state.player.animState === 'undefined') state.player.animState = 'idle';
    if (state.player.cls && state.player.cls.id && CLASSES[state.player.cls.id]) state.player.cls = CLASSES[state.player.cls.id];

    if (['battle', 'tacticSelect'].includes(state.screen)) {
        state.monster = MONSTERS[state.stage] || MONSTERS[0];
        if (typeof state.monsterHp !== 'number' || state.monsterHp <= 0) state.monsterHp = state.monster.hp;
        if (!state.monsterNextMove) determineMonsterMove();
        else if (!state.monsterHintText) state.monsterHintText = pickMonsterHint(state.monster, state.monsterNextMove);
    }
    if (state.isAnimating) state.isAnimating = false;
}

const $ = (id) => document.getElementById(id);

// --- 4. 게임 핵심 흐름 함수 영역 ---

function saveGame() { localStorage.setItem('rpsRPG_save', JSON.stringify(state)); }

function loadGame() {
    const saved = localStorage.getItem('rpsRPG_save');
    if (!saved) return;
    try {
        const parsed = JSON.parse(saved);
        if (!parsed || !parsed.player || !parsed.player.cls) throw new Error('저장 데이터가 비어 있습니다.');
        state = parsed;
        ensureStateDefaults();
        state.lastRenderedScreen = ''; 
        state.isAnimating = false;
        AudioEngine.init();
        if (state.screen === 'ending') AudioEngine.playBGM('ending');
        else if (['title', 'prologue', 'difficultySelect', 'classSelect'].includes(state.screen)) AudioEngine.playBGM('title');
        else AudioEngine.playBGM(`stage${state.currentRegion}`);
        render();
        setTimeout(adjustScale, 0);
    } catch (e) {
        console.warn('Save load failed:', e);
        localStorage.removeItem('rpsRPG_save');
        state.screen = 'title';
        state.isAnimating = false;
        addLog('저장 데이터가 손상되어 새로 시작 화면으로 돌아왔습니다.', 'bad');
        render();
    }
}

function showFloatingText(target, text, colorClass) {
    const id = Date.now() + Math.random();
    state.floatingTexts.push({ id, target, text, colorClass });
    setTimeout(() => {
        const lenBefore = state.floatingTexts.length;
        state.floatingTexts = state.floatingTexts.filter(f => f.id !== id);
        if (lenBefore !== state.floatingTexts.length && !state.isAnimating) {
            render();
        }
    }, 1000);
}

function addLog(msg, type='normal') {
    const colors = { 'normal': 'text-slate-300', 'good': 'text-green-400 font-bold', 'bad': 'text-red-400 font-bold', 'info': 'text-yellow-300', 'aug': 'text-purple-400 font-bold' };
    state.log.unshift(`<span class="${colors[type]}">${msg}</span>`);
    if(state.log.length > 30) state.log.pop();
}

function hasAug(id) { return state.player.augments.some(a => a.id === id); }

function unlockAchievement(id) {
    if (!state.achievements[id]) {
        state.achievements[id] = true;
        const ach = ACHIEVEMENTS_LIST.find(a => a.id === id);
        addLog(`🏆 업적 달성: ${ach.name}`, 'good');
        showFloatingText('player', '업적 달성!', 'text-yellow-400 drop-shadow-md');
    }
}


function pickMonsterHint(mon, move) {
    if (!mon || !mon.hints || !move) return '적의 움직임을 잘 살펴보세요.';
    const hintSource = mon.hints[move];
    if (Array.isArray(hintSource)) {
        if (hintSource.length === 0) return '적의 움직임을 잘 살펴보세요.';
        return hintSource[Math.floor(Math.random() * hintSource.length)];
    }
    return hintSource || '적의 움직임을 잘 살펴보세요.';
}

function determineMonsterMove() {
    const mon = state.monster;
    let move = ['scissors', 'rock', 'paper'][Math.floor(Math.random() * 3)];
    let disabledMove = null;
    
    if (state.monsterStatus && state.monsterStatus.type === 'sealed') {
        disabledMove = state.monsterStatus.move;
        while (move === disabledMove) move = ['scissors', 'rock', 'paper'][Math.floor(Math.random() * 3)];
    }

    if (mon.pattern === 'boss_golem' && state.turnCount % 3 === 2) {
        move = Math.random() < 0.9 ? 'rock' : move;
    } else if (mon.pattern === 'boss_swordsman') {
        move = Math.random() < 0.7 ? 'scissors' : move;
    } else if (mon.pattern === 'boss_demon') {
        const hist = state.player.history;
        if (hist.length >= 2 && hist[hist.length-1] === hist[hist.length-2] && Math.random() < 0.8) {
            const last = hist[hist.length-1];
            move = last === 'rock' ? 'paper' : (last === 'paper' ? 'scissors' : 'rock');
        } else if (Math.random() < 0.4) {
            let fav = 'rock';
            if(state.player.stats.scissors > state.player.stats.rock) fav = 'scissors';
            if(state.player.stats.paper > Math.max(state.player.stats.rock, state.player.stats.scissors)) fav = 'paper';
            move = fav === 'rock' ? 'paper' : (fav === 'paper' ? 'scissors' : 'rock');
        }
    } else if (mon.pattern === 'heavy_rock' && Math.random() < 0.6) {
        move = 'rock';
    } else if (mon.pattern === 'heavy_paper' && Math.random() < 0.6) {
        move = 'paper';
    } else if (mon.pattern === 'heavy_scissors' && Math.random() < 0.6) {
        move = 'scissors';
    } else if (mon.pattern === 'counter' && Math.random() < 0.5) {
        let fav = 'rock';
        if(state.player.stats.scissors > state.player.stats.rock) fav = 'scissors';
        if(state.player.stats.paper > Math.max(state.player.stats.rock, state.player.stats.scissors)) fav = 'paper';
        move = fav === 'rock' ? 'paper' : (fav === 'paper' ? 'scissors' : 'rock');
    }
    
    if (disabledMove && move === disabledMove) {
        const remaining = ['scissors', 'rock', 'paper'].filter(m => m !== disabledMove);
        move = remaining[Math.floor(Math.random() * remaining.length)];
    }

    // 같은 패가 3번 연속 나오면 재미가 떨어지므로, 3연속 반복은 자동으로 끊습니다.
    // 단, 봉인된 패가 있으면 그 패는 계속 제외합니다.
    if (!Array.isArray(state.monsterMoveHistory)) state.monsterMoveHistory = [];
    const recent = state.monsterMoveHistory.slice(-2);
    if (recent.length === 2 && recent[0] === recent[1] && move === recent[0]) {
        const candidates = ['scissors', 'rock', 'paper'].filter(m => m !== recent[0] && m !== disabledMove);
        if (candidates.length > 0) {
            move = candidates[Math.floor(Math.random() * candidates.length)];
        }
    }

    state.monsterNextMove = move;
    // 한 턴 동안 힌트가 바뀌지 않도록, 패가 정해지는 순간 힌트도 함께 고정합니다.
    // 배열 힌트도 여기서 한 번만 랜덤 선택되어 같은 턴에 두 문장이 보이지 않습니다.
    state.monsterHintText = pickMonsterHint(mon, move);
    state.monsterMoveHistory.push(move);
    if (state.monsterMoveHistory.length > 4) state.monsterMoveHistory.shift();
}

// 각종 화면 전환 처리
function startGame() { AudioEngine.init(); AudioEngine.sfx.select(); state.screen = 'prologue'; render(); }
function goToDifficulty() { AudioEngine.sfx.select(); state.screen = 'difficultySelect'; render(); }
function selectDifficulty(diff) { AudioEngine.sfx.select(); state.difficulty = diff; state.screen = 'classSelect'; render(); }

function selectClass(classId) {
    AudioEngine.sfx.select(); 
    const cls = CLASSES[classId];
    if (!cls) return;
    
    state.player = {
        cls: cls, hp: cls.baseHp, maxHp: cls.baseHp, energy: 0, maxEnergy: 5, atk: cls.baseAtk, level: 1, exp: 0, gold: 50, revives: 0,
        stats: { scissors: 0, rock: 0, paper: 0 }, inventory: { crystal: 0, cloak: 0, candy: 0, bomb: 0, flash: 0 },
        buff: null, nextBuff: null, activeBuff: null, augments: [], seenAugments: [], consecutiveWins: 0, consecutiveDraws: 0, history: [], tactic: null, tacticUsed: false, firstDmgTaken: false,
        equipLevel: { weapon: 0, armor: 0, accessory: 0 }, animState: 'idle'
    };
    
    if(state.difficulty === 'easy') { 
        state.player.maxHp += 20;

    }

function checkRegionStart() {
    if (state.stage === 0) { state.screen = 'regionIntro'; state.currentRegion = 1; }
    else if (state.stage === 4) { state.screen = 'regionIntro'; state.currentRegion = 2; }
    else if (state.stage === 8) { state.screen = 'regionIntro'; state.currentRegion = 3; }
    else if (state.stage === 12) { state.screen = 'regionIntro'; state.currentRegion = 4; }
    else if (state.stage === 16) { state.screen = 'regionIntro'; state.currentRegion = 5; }
    else { startTacticSelect(); return; }
    
    AudioEngine.playBGM(`stage${state.currentRegion}`);
    render();
}

function isBossStage(stageIndex = state.stage) {
    return [3, 7, 11, 15, 19].includes(stageIndex);
}

function startTacticSelect() {
    AudioEngine.sfx.select();
    state.monster = MONSTERS[state.stage]; 
    state.bestiary[state.monster.id] = true;

    // 일반 전투는 작전 선택을 생략하고 바로 시작합니다.
    // 보스전에서만 작전 선택을 남겨 선택의 무게감을 살립니다.
    if (!isBossStage(state.stage)) {
        state.player.tactic = null;
        state.player.tacticUsed = true;
        startBattle();
        return;
    }

    state.offeredTacticsOptions = TACTICS.sort(() => 0.5 - Math.random()).slice(0, 3);
    state.screen = 'tacticSelect'; 
    render();
}

function chooseTactic(tacticId) {
    if (state.isAnimating) return;
    AudioEngine.sfx.select(); 
    state.player.tactic = tacticId; 
    state.player.tacticUsed = false; 
    startBattle();
}

function startBattle() {
    state.monsterHp = state.monster.hp; 
    state.screen = 'battle'; 
    state.player.buff = null; 
    state.turnCount = 0;
    state.monsterMoveHistory = [];
    state.player.consecutiveWins = 0; 
    state.player.consecutiveDraws = 0; 
    state.monsterStatus = null; 
    state.player.firstDmgTaken = false;
    state.crystalHintActive = false; 
    state.prophecyHintActive = false;
    state.player.animState = 'idle'; 
    state.isAnimating = false; 
    state.floatingTexts = [];
    
    state.player.activeBuff = state.player.nextBuff; 
    state.player.nextBuff = null;
    
    addLog(`STAGE ${state.stage + 1}: ${state.monster.name} 등장!`, 'bad'); 
    addLog(`"${state.monster.dialogue}"`, 'normal');
    
    // 소비 아이템 및 작전 자동 적용부
    if (state.player.inventory.candy > 0) { state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 2); state.player.inventory.candy--; addLog(`🍬 집중의 사탕: 기력 +2`, 'info'); }
    if (state.player.inventory.bomb > 0) { state.monsterHp -= 25; showFloatingText('monster', '-25', 'text-red-500 drop-shadow-md'); state.player.inventory.bomb--; addLog(`💣 고블린 폭탄: 적에게 25 피해!`, 'good'); }
    if (state.player.inventory.flash > 0) { state.monsterStatus = { type: 'stunned', duration: 1 }; state.player.inventory.flash--; addLog(`💥 섬광탄: 적이 1턴 기절합니다!`, 'good'); }
    if (state.player.inventory.crystal > 0) state.crystalHintActive = true;
    
    if (state.player.activeBuff === 'atk_boost') addLog(`🐯 [호랑이 기운] 이번 전투 공격력 1.5배!`, 'info');
    if (state.player.activeBuff === 'thorns_aura') addLog(`🌵 [가시 오라] 반사 피해 +5 활성화!`, 'info');
    if (state.player.activeBuff === 'mana_surge') addLog(`⚡ [마력 폭주] 스킬 기력 소모 0!`, 'info');
    
    if (hasAug('aug_heavy')) { state.player.energy = 0; addLog(`🐢 무거운 갑옷: 시작 기력이 0이 됩니다.`, 'info'); }
    if (hasAug('aug_greed')) { let g = Math.floor(Math.random() * 11) + 5; state.player.gold += g; addLog(`💰 탐욕의 항아리: ${g} 골드 획득!`, 'aug'); }
    if (hasAug('aug_survival') && state.player.hp <= state.player.maxHp * 0.5) { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 20); showFloatingText('player', '+20', 'text-green-400 drop-shadow-md'); addLog(`🍖 생존 본능: 체력 20 회복!`, 'aug'); }
    
    if (state.player.tactic === 'reckless') { state.player.energy = 0; addLog("🔥 무모한 돌진: 기력이 0이 됩니다.", 'info'); }
    if (state.player.tactic === 'meditate') { state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 2); addLog("🌿 명상: 시작 기력 +2", 'info'); }
    if (state.player.tactic === 'sacrifice') { state.player.hp = Math.max(1, state.player.hp - 5); showFloatingText('player', '-5', 'text-red-500 drop-shadow-md'); addLog("❤️ 혈투: 시작 체력 -5", 'bad'); }
    if (state.player.tactic === 'lucky') { if(Math.random() < 0.5) { state.player.energy = state.player.maxEnergy; addLog("🍀 행운의 동전: 기력 MAX!", 'good'); } else { addLog("🍀 행운의 동전: 꽝!", 'info'); } state.player.tacticUsed = true; }
    if (state.player.tactic === 'iron') { state.player.hp = Math.max(1, state.player.hp - 3); showFloatingText('player', '-3', 'text-red-500 drop-shadow-md'); addLog("✊ 단단한 피부: 시작 체력 -3", 'bad'); }
    if (state.player.tactic === 'observe') state.player.tacticUsed = true; 
    
    determineMonsterMove(); 
    render();
}

function openBestiary() { AudioEngine.sfx.select(); state.screen = 'bestiary'; render(); }
function openAchievements() { AudioEngine.sfx.select(); state.screen = 'achievements'; render(); }

function upgradeEquip(type) {
    if (state.isAnimating) return;
    let currentLv = state.player.equipLevel[type]; 
    let nextUpgrade = UPGRADES[type][currentLv];
    
    if (nextUpgrade && state.player.gold >= nextUpgrade.price) {
        AudioEngine.sfx.coin(); 
        state.player.gold -= nextUpgrade.price;
        
        let prevUpgrade = currentLv > 0 ? UPGRADES[type][currentLv - 1] : null;
        let diffAtk = (nextUpgrade.atk || 0) - (prevUpgrade ? (prevUpgrade.atk || 0) : 0);
        let diffHp = (nextUpgrade.hp || 0) - (prevUpgrade ? (prevUpgrade.hp || 0) : 0);
        let diffEn = (nextUpgrade.energy || 0) - (prevUpgrade ? (prevUpgrade.energy || 0) : 0);
        
        if(diffAtk) state.player.atk += diffAtk; 
        if(diffHp) { state.player.maxHp += diffHp; state.player.hp += diffHp; } 
        if(diffEn) state.player.maxEnergy += diffEn;
        
        state.player.equipLevel[type]++;
        if(state.player.equipLevel[type] >= 4) unlockAchievement('maxUpgrade');
        
        saveGame();
        let msgEl = $('shop-msg');
        if(msgEl) { 
            msgEl.innerText = `${nextUpgrade.name} 업그레이드 완료!`; 
            msgEl.classList.remove('fade-in'); 
            void msgEl.offsetWidth; 
            msgEl.classList.add('fade-in'); 
            setTimeout(() => { if($('shop-msg')) $('shop-msg').innerText = ''; }, 2000); 
        }
        render(); 
    }
}

function buyItem(itemId, tab) {
    if (state.isAnimating) return;
    const item = SHOP_ITEMS[tab].find(i => i.id === itemId);
    if (state.player.gold >= item.price) {
        AudioEngine.sfx.coin(); 
        state.player.gold -= item.price;
        
        let msgStr = `${item.name} 구매 완료!`; 
        const res = item.action(state.player); 
        if(res) msgStr = res; 
        if(tab === 'buff') item.bought = true; 
        
        saveGame(); 
        render(); 
        
        const msgEl = $('shop-msg');
        if(msgEl) { 
            msgEl.innerText = msgStr; 
            msgEl.classList.remove('fade-in'); 
            void msgEl.offsetWidth; 
            msgEl.classList.add('fade-in'); 
            setTimeout(() => { if($('shop-msg')) $('shop-msg').innerText = ''; }, 2000); 
        }
    }
}

function useSkill() {
    if (state.isAnimating) return; 
    AudioEngine.sfx.select();
    
    const cost = state.player.activeBuff === 'mana_surge' ? 0 : 3;
    if (state.player.energy < cost) { 
        addLog("기력이 부족합니다!", 'bad'); 
        render(); 
        return; 
    }
    
    state.player.energy -= cost; 
    const cid = state.player.cls.id;
    
    if (cid === 'scissors') { 
        state.player.buff = 'double_dmg'; 
        addLog("⚔️ 연속 베기! 다음 승리 피해가 2배가 된다!", 'info'); 
        showFloatingText('player', '연속 베기 준비!', 'text-yellow-300 drop-shadow-md');
    } else if (cid === 'rock') { 
        state.player.buff = 'iron_counter'; 
        addLog("🔰 철벽 반격! 다음 패배 피해를 막고 되돌려준다!", 'info'); 
        showFloatingText('player', '철벽 반격 준비!', 'text-blue-300 drop-shadow-md');
    } else if (cid === 'paper') { 
        let healAmount = 15;
        if (hasAug('aug_prophecy')) healAmount += 10;
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + healAmount); 
        state.prophecyHintActive = true;
        AudioEngine.sfx.heal(); 
        showFloatingText('player', `+${healAmount} 예언!`, 'text-green-400 drop-shadow-md'); 
        addLog(`✨ 예언의 종이학! 체력 ${healAmount} 회복, 다음 적 행동을 읽었다!`, 'good');
        if (hasAug('aug_prophecy')) addLog("✨ 예언 강화! 회복량이 10 늘었다!", 'aug'); 
    }
    
    if (hasAug('aug_meditation')) { 
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 15); 
        showFloatingText('player', '+15', 'text-green-400 drop-shadow-md'); 
        addLog("🌿 명상 효과로 추가 15 체력 회복!", 'aug'); 
    }
    render();
}

function playTurn(playerMove) {
    if (state.isAnimating || state.player.hp <= 0 || state.monsterHp <= 0) return;
    state.isAnimating = true;
    
    if(state.turnCount === 0 && state.crystalHintActive) { 
        state.player.inventory.crystal--; 
        state.crystalHintActive = false; 
    }
    if(state.prophecyHintActive) {
        state.prophecyHintActive = false;
    }
    
    state.turnCount++; 
    state.player.stats[playerMove]++; 
    state.player.history.push(playerMove);
    if(state.player.history.length > 5) state.player.history.shift();
    
    if (hasAug('aug_lucky') && Math.random() < 0.2) { 
        state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 1); 
        addLog("🍀 행운: 기력 +1!", 'aug'); 
    }
    if (hasAug('aug_last') && state.turnCount >= 5) { 
        state.player.hp = Math.min(state.player.maxHp, state.player.hp + 3); 
        showFloatingText('player', '+3', 'text-green-400 drop-shadow-md'); 
        addLog("⏳ 장기전: 체력 +3!", 'aug'); 
    }

    const monMove = state.monsterNextMove; 
    const pName = MOVES[playerMove].name; 
    const mName = MOVES[monMove].name;
    
    if (state.monster.pattern === 'boss_golem' && state.turnCount % 3 === 1) addLog("⚠️ 골렘이 굳건한 방어 태세를 준비합니다!", 'bad');
    addLog(`나: ${pName} VS 적: ${mName}`);
    
    // 전투 판정: 1(승리), 0(무승부), -1(패배)
    let result = 0; 
    if (playerMove === monMove) result = 0;
    else if ((playerMove === 'scissors' && monMove === 'paper') || (playerMove === 'rock' && monMove === 'scissors') || (playerMove === 'paper' && monMove === 'rock')) result = 1;
    else result = -1;

    if (result === -1 && state.player.inventory.cloak > 0) { 
        result = 0; 
        state.player.inventory.cloak--; 
        addLog("🎭 망토 발동! 무승부로 회피.", 'info'); 
    }
    if (state.monsterStatus && state.monsterStatus.type === 'stunned') { 
        addLog("적은 기절해서 움직일 수 없다!", 'good'); 
        if (result === -1) result = 0; 
    }

    let lastTurnWasLoss = (state.player.lastResult === -1); 
    state.player.lastResult = result;
    
    let tUsed = state.player.tacticUsed; 
    let tactic = state.player.tactic;

    // === 승리(Win) 로직 ===
    if (result === 1) { 
        state.player.animState = 'attack'; 
        AudioEngine.sfx.hit(); 
        state.player.consecutiveWins++; 
        state.player.consecutiveDraws = 0; 
        let dmg = state.player.atk;
        
        if (!tUsed) {
            if (tactic === 'ambush') { dmg += 3; addLog("🔪 기습 성공! 피해 +3", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'reckless') { dmg += 5; addLog("🔥 무모한 돌진! 피해 +5", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'vampire') { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 5); showFloatingText('player', '+5', 'text-green-400 drop-shadow-md'); addLog("🦇 흡혈 태세! 체력 5 회복", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'meditate') { dmg = Math.max(1, dmg - 2); addLog("🌿 명상 페널티: 피해 -2", 'bad'); state.player.tacticUsed = true; }
            else if (tactic === 'thief') { state.player.gold += 10; addLog("💰 소매치기 성공! 10 골드", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'sacrifice') { dmg += 6; addLog("❤️ 혈투의 일격! 피해 +6", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'berserk') { dmg *= 2; addLog("😡 광전사의 일격! 피해 2배!", 'good'); state.player.tacticUsed = true; }
        }
        
        if (state.turnCount === 1 && hasAug('aug_first')) { dmg += 5; addLog("⚔️ 선봉장 효과! 피해 +5", 'aug'); }
        if (hasAug('aug_revenge') && lastTurnWasLoss) { dmg += 5; addLog("😠 복수심 폭발! 피해 +5", 'aug'); }
        if (state.player.cls.id === 'scissors') { if (playerMove === 'scissors') { dmg += 3; addLog("✌️ 쌍검 베기! 승리 피해 +3", 'good'); } if (state.player.consecutiveWins >= 3) { dmg *= 2; addLog("🌪️ 폭풍 베기! 3연속 승리로 이번 피해 2배!", 'good'); } }
        if (state.player.cls.id === 'paper' && playerMove === 'paper') { 
            state.monsterStatus = { type: 'sealed', move: monMove, duration: 2 }; 
            state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 1);
            addLog(`✋ 장막 봉인! 적의 ${MOVES[monMove].name}를 다음 턴 막았다!`, 'good'); 
            addLog("💫 장막 집중! 기력 +1", 'good');
            showFloatingText('monster', '봉인!', 'text-purple-300 drop-shadow-md text-[36px]');
            showFloatingText('player', '+1 기력', 'text-yellow-300 drop-shadow-md');
            if (hasAug('aug_magic')) {
                state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 1);
                addLog("✋ 장막 집중 강화! 기력 +1 추가", 'aug');
                showFloatingText('player', '+1 기력', 'text-purple-300 drop-shadow-md');
            }
        }
        if (state.monster.pattern === 'boss_golem' && playerMove === 'paper' && state.turnCount % 3 === 2) { dmg *= 2; addLog("💥 치명타!", 'good'); }
        if (state.monster.pattern === 'boss_swordsman' && playerMove === 'rock') { state.monsterStatus = { type: 'stunned', duration: 1 }; addLog("💫 적 기절!", 'good'); }
        if (state.monster.pattern === 'boss_demon' && new Set(state.player.history.slice(-3)).size === 3) { dmg = Math.floor(dmg * 1.5); addLog("🌀 마왕 혼란! 피해 1.5배!", 'good'); }
        if (state.player.buff === 'double_dmg') { dmg *= 2; addLog("⚔️ 연속 베기 발동! 이번 승리 피해 2배!", 'good'); }
        if (state.player.activeBuff === 'atk_boost') dmg = Math.floor(dmg * 1.5);
        if (hasAug('aug_sc_dmg') && playerMove === 'scissors') { dmg += 5; addLog("✌️ 예리한 칼날! 피해 +5", 'aug'); }
        if (hasAug('aug_combo') && state.player.consecutiveWins >= 2) { dmg += 4; addLog("🔥 콤보 마스터! 연승 피해 +4", 'aug'); }
        if (hasAug('aug_focus') && state.player.consecutiveWins >= 3) { dmg += 10; addLog("🌪️ 폭풍 강화! 추가 피해 +10", 'aug'); }
        if (hasAug('aug_berserk') && state.player.hp <= state.player.maxHp * 0.3) { dmg = Math.floor(dmg * 1.5); addLog("😡 광전사! 피해 1.5배!", 'aug'); }
        
        state.monsterHp -= dmg; 
        state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 1);
        
        let msg = `공격 성공! ${dmg} 피해!`; 
        showFloatingText('monster', `-${dmg}`, 'text-white font-bold drop-shadow-[0_0_8px_rgba(239,68,68,1)] text-[40px]');
        
        if (dmg >= 50) unlockAchievement('overkill');
        
        if (hasAug('aug_vampire')) { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 3); msg += ` ❤️ 흡혈 +3`; showFloatingText('player', '+3', 'text-green-400 drop-shadow-md'); }
        addLog(msg, 'good');
        
        if (state.monsterHp < 0 && hasAug('aug_blood')) { 
            const overDmg = Math.abs(state.monsterHp); 
            state.player.hp = Math.min(state.player.maxHp, state.player.hp + overDmg); 
            showFloatingText('player', `+${overDmg}`, 'text-green-400 drop-shadow-md'); 
            addLog(`🦇 초과 피해 흡수! 체력 ${overDmg} 회복`, 'aug'); 
        }
        if (state.player.consecutiveWins >= 3) unlockAchievement('winStreak3');
        state.shakeTarget = 'monster';
        
    // === 무승부(Draw) 로직 ===
    } else if (result === 0) { 
        state.player.animState = 'draw'; 
        AudioEngine.sfx.select(); 
        state.player.consecutiveWins = 0; 
        state.player.consecutiveDraws++;
        
        let eGain = 2; 
        if (hasAug('aug_energy')) eGain += 1; 
        state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + eGain);
        
        if (!tUsed) {
            if (tactic === 'draw_heal') { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 5); showFloatingText('player', '+5', 'text-green-400 drop-shadow-md'); addLog("🩹 숨 고르기: 체력 5 회복", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'draw_energy') { state.player.energy = Math.min(state.player.maxEnergy, state.player.energy + 2); addLog("⚡ 기 모으기: 기력 +2", 'good'); state.player.tacticUsed = true; }
        }

        let msg = `서로 부딪혔다! 무승부. (기력+${eGain})`; 
        showFloatingText('monster', `무승부!`, 'text-blue-300 drop-shadow-md');

        if (state.player.cls.id === 'rock' && playerMove === 'rock') { 
            const counterDmg = Math.max(3, Math.floor(state.player.atk * 0.5));
            state.monsterHp -= counterDmg;
            msg += ` 🔰 방패 반격 ${counterDmg} 피해!`;
            addLog(`🔰 방패 반격! 비겼지만 적에게 ${counterDmg} 피해!`, 'good');
            showFloatingText('monster', `-${counterDmg}`, 'text-blue-300 drop-shadow-md text-[34px]');
            state.shakeTarget = 'monster';
        }
        if (state.player.cls.id === 'paper') { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 5); msg += ` 장막 회복+5`; showFloatingText('player','+5','text-green-400'); }
        if (hasAug('aug_pp_heal') && playerMove === 'paper') { state.player.hp = Math.min(state.player.maxHp, state.player.hp + 7); msg += ` 📜 마법 회복+7`; showFloatingText('player','+7','text-green-400');}
        if (hasAug('aug_stone') && playerMove === 'rock') { state.monsterHp -= 5; msg += ` ✊ 방패 반격 강화! 추가 5 피해`; state.shakeTarget = 'monster'; showFloatingText('monster','-5','text-red-400');}
        if (hasAug('aug_wind')) { state.monsterHp -= 3; msg += ` 🌪️ 칼바람 피해 3!`; state.shakeTarget = 'monster'; showFloatingText('monster','-3','text-red-400');}
        if (hasAug('aug_vital') && Math.random() < 0.5) { state.player.maxHp++; state.player.hp++; msg += ` 🍎 최대체력+1`; showFloatingText('player','+1','text-yellow-400');}
        if (state.monster.pattern === 'boss_demon') { state.monsterHp += 15; msg += ` 👿 마왕 체력 회복!`; showFloatingText('monster','+15','text-green-400');}
        
        addLog(msg, 'info');
        if (state.player.consecutiveDraws >= 5) unlockAchievement('drawStreak5');
        
    // === 패배(Loss) 로직 ===
    } else { 
        state.player.animState = 'hit'; 
        AudioEngine.sfx.lose(); 
        state.player.consecutiveWins = 0; 
        state.player.consecutiveDraws = 0; 
        let dmg = state.monster.atk;
        
        if (!tUsed) {
            if (tactic === 'ambush') { dmg += 2; addLog("⚠️ 기습 실패: 피해 +2", 'bad'); state.player.tacticUsed = true; }
            else if (tactic === 'defend') { dmg = Math.max(1, dmg - 3); addLog("🔰 방어 태세: 피해 -3", 'info'); state.player.tacticUsed = true; }
            else if (tactic === 'reflect') { state.monsterHp -= 4; showFloatingText('monster','-4','text-red-400'); addLog("🔮 방패 치기: 적에게 4 피해 반사!", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'berserk') { dmg *= 2; addLog("😡 광전사 페널티: 피해 2배!", 'bad'); state.player.tacticUsed = true; }
            else if (tactic === 'iron') { dmg = 0; addLog("✊ 단단한 피부: 첫 피해 무효화!", 'good'); state.player.tacticUsed = true; }
            else if (tactic === 'scout') { dmg += 3; addLog("⚠️ 정찰 페널티: 피해 +3", 'bad'); state.player.tacticUsed = true; }
        }

        if (hasAug('aug_iron') && !state.player.firstDmgTaken) { dmg = 0; state.player.firstDmgTaken = true; addLog("🔰 무쇠 피부로 첫 피해를 막았습니다!", 'aug'); } 
        else if (hasAug('aug_shadow') && state.player.hp <= 15 && Math.random() < 0.5) { dmg = 0; addLog("🌑 그림자 망토! 적의 공격을 회피했습니다!", 'aug'); }
        else if (state.player.buff === 'iron_counter') { 
            const blockedDmg = dmg;
            dmg = 0; 
            let counterDmg = Math.max(1, Math.floor(blockedDmg * 0.7));
            if (hasAug('aug_mirror')) {
                counterDmg += 5;
                addLog("💥 철벽 강화! 되돌려주기 피해 +5", 'aug');
            }
            state.monsterHp -= counterDmg;
            addLog(`🔰 철벽 반격! 피해를 막고 ${counterDmg} 피해를 되돌려줬다!`, 'good');
            showFloatingText('player', '막았다!', 'text-blue-300 drop-shadow-md text-[34px]');
            showFloatingText('monster', `-${counterDmg}`, 'text-blue-300 drop-shadow-md text-[40px]');
            state.shakeTarget = 'monster';
        } 
        else {
            if (state.player.cls.id === 'rock' && state.player.hp <= state.player.maxHp * 0.3) dmg = Math.floor(dmg / 2);
            if (state.player.cls.id === 'rock' && playerMove === 'rock') dmg = Math.max(1, dmg - 3);
            if (hasAug('aug_rk_def') && playerMove === 'rock') dmg = Math.max(1, dmg - 4);
            if (hasAug('aug_mana_shield') && state.player.energy > 0) { state.player.energy--; dmg = Math.max(0, dmg - 5); addLog("💠 마나 실드: 기력 1소모, 피해 5 감소!", 'aug'); }
            if (state.monster.pattern === 'boss_swordsman' && playerMove === 'paper') dmg = Math.floor(dmg * 1.5);
        }
        
        state.player.hp -= dmg; 
        state.player.firstDmgTaken = true;
        
        if(dmg > 0) { 
            addLog(`적의 공격에 당했다... ${dmg} 피해!`, 'bad'); 
            showFloatingText('player', `-${dmg}`, 'text-red-500 drop-shadow-md text-[40px]'); 
        }

        let reflectDmg = 0;
        if (hasAug('aug_thorns') && dmg > 0) reflectDmg += 3;
        if (state.player.activeBuff === 'thorns_aura' && dmg > 0) reflectDmg += 5;
        if (reflectDmg > 0) { state.monsterHp -= reflectDmg; showFloatingText('monster', `-${reflectDmg}`, 'text-red-400 drop-shadow-md'); addLog(`💥 반사 효과로 적에게 ${reflectDmg} 피해!`, 'aug'); }
        
        state.shakeTarget = 'player';
    }
    
    state.player.buff = null;
    if (state.monsterStatus) { 
        state.monsterStatus.duration--; 
        if (state.monsterStatus.duration <= 0) state.monsterStatus = null; 
    }
    
    render(); 

    setTimeout(() => {
        state.player.animState = 'idle';
        state.shakeTarget = null;
        
        if (state.player.hp <= 0) {
            if (state.player.revives > 0) {
                state.player.revives--; 
                state.player.hp = Math.floor(state.player.maxHp * 0.5); 
                AudioEngine.sfx.heal();
                unlockAchievement('revived'); 
                addLog("✨ 부활의 십자가! 체력 50%로 부활!", 'good'); 
                showFloatingText('player', '부활!', 'text-yellow-400 drop-shadow-md');
                state.shakeTarget = 'player'; 
                state.isAnimating = false; 
                render();
            } else { 
                state.screen = 'gameover'; 
                AudioEngine.sfx.lose(); 
                state.isAnimating = false; 
                render(); 
            }
        } else if (state.monsterHp <= 0) {
            processBattleVictory();
        } else {
            determineMonsterMove(); 
            state.isAnimating = false; 
            render();
        }
    }, 1000); 
}

function processBattleVictory() {
    AudioEngine.sfx.win();
    if (state.player.hp === 1 && !state.achievements.survive1Hp) {
        state.achievements.survive1Hp = true;
        addLog("🏆 업적 달성: 기적의 생존자 달성!", 'good');
    }
    if (!state.player.firstDmgTaken) unlockAchievement('perfectWin');

    let goldGain = state.monster.goldReward;
    if (hasAug('aug_rich')) goldGain += 15;
    if (hasAug('aug_gamble') && Math.random() < 0.2) { goldGain *= 2; addLog(`🎲 승부사: 골드 2배!`, 'aug'); }
    if (hasAug('aug_bounty') && [3,7,11,15,19].includes(state.stage)) { goldGain += 100; addLog(`🐉 드래곤 슬레이어: 보스 보상 +100G!`, 'aug'); }
    
    addLog(`전투 승리! ${state.monster.exp}EXP, 💰${goldGain} 골드 획득.`, 'good');
    state.player.exp += state.monster.exp; 
    state.player.gold += goldGain;
    
    if (state.player.gold >= 300) unlockAchievement('rich');

    if (state.player.exp >= state.player.level * 50) {
        state.player.level++; state.player.maxHp += 15; state.player.hp = state.player.maxHp; state.player.atk += 3;
        addLog(`🎉 레벨 업! Lv.${state.player.level} 달성!`, 'good');
    }
    
    state.player.activeBuff = null; 
    SHOP_ITEMS.buff.forEach(i => i.bought = false);

    // 증강은 매 스테이지가 아니라 보스전 승리 후에만 선택합니다.
    // 현재 state.stage는 아직 방금 클리어한 스테이지 번호이므로 먼저 기록합니다.
    const clearedStage = state.stage;
    const clearedBoss = isBossStage(clearedStage);

    state.stage++;
    if (state.stage >= MONSTERS.length) {
        saveGame();
        state.screen = 'ending'; 
        AudioEngine.playBGM('ending');
    } else if (clearedBoss) {
        const clsId = state.player.cls.id;
        let classAugs = AUGMENTS.filter(a => (a.forCls === clsId || a.forCls === 'common') && !hasAug(a.id));
        let availableAugs = classAugs.filter(a => !state.player.seenAugments.includes(a.id));
        if (availableAugs.length < 3) availableAugs = classAugs;
        state.offeredAugments = availableAugs.sort(() => 0.5 - Math.random()).slice(0, 3);

        if (state.offeredAugments.length > 0) {
            state.offeredAugments.forEach(a => { if(!state.player.seenAugments.includes(a.id)) state.player.seenAugments.push(a.id); });
            saveGame();
            state.screen = 'augmentSelect';
        } else {
            addLog('🔮 더 이상 고를 증강이 없어 바로 다음으로 진행합니다.', 'info');
            saveGame();
            state.screen = 'victory';
        }
    } else {
        saveGame();
        state.screen = 'victory';
    }
    state.isAnimating = false;
    render();
}

function selectAugment(augId) {
    if (state.isAnimating) return;
    AudioEngine.sfx.select();
    const aug = AUGMENTS.find(a => a.id === augId);
    if (!aug) return;
    state.player.augments.push(aug);

    if (aug.id === 'aug_giant') {
        state.player.maxHp += 20;
        state.player.hp += 20;
        addLog("💪 튼튼한 몸! 최대 체력 +20", 'aug');
    }
    if (aug.id === 'aug_power') {
        state.player.atk += 3;
        addLog("⚔️ 기본기 훈련! 공격력 +3", 'aug');
    }

    if (state.player.augments.length >= 4) unlockAchievement('collector');
    saveGame(); 
    state.screen = 'victory'; 
    render();
}

function restartGame() {
    AudioEngine.sfx.select(); 
    state.screen = 'title'; 
    SHOP_ITEMS.buff.forEach(i => i.bought = false); 
    AudioEngine.playBGM('title'); 
    render();
}

function renderBattle(audioBtn, transitionClass, bgImage) {
    if (isMobilePortraitMode()) return renderBattleMobile(audioBtn, transitionClass, bgImage);
    const mon = state.monster; const p = state.player;
    const monHpPercent = Math.max(0, (state.monsterHp / mon.hp) * 100);
    const pHpPercent = Math.max(0, (p.hp / p.maxHp) * 100);
    
    let hintText = state.monsterHintText || pickMonsterHint(mon, state.monsterNextMove);
    let showVisualBubble = false; let visualBubbleIcon = '';

    if (state.crystalHintActive && state.turnCount === 0) { 
        hintText = `<span class="text-pink-400 font-bold drop-shadow">🔮 [수정구 발동] 다음 공격은 완벽히 보입니다!</span>`; 
        showVisualBubble = true; visualBubbleIcon = MOVE_ICONS[state.monsterNextMove]; 
    } else if (state.prophecyHintActive) {
        hintText = `<span class="text-purple-300 font-bold drop-shadow">✨ [예언 발동] 적의 다음 행동을 읽었습니다!</span>`;
        showVisualBubble = true; visualBubbleIcon = MOVE_ICONS[state.monsterNextMove];
    } else if (state.player.tactic === 'scout' && state.turnCount === 0) { 
        hintText = `<span class="text-pink-400 font-bold drop-shadow">🔭 [정찰 확신] 적의 첫 공격을 꿰뚫어봅니다.</span>`; 
        showVisualBubble = true; visualBubbleIcon = MOVE_ICONS[state.monsterNextMove]; 
    } else if (state.player.tactic === 'observe' && state.turnCount === 0) { 
        hintText = `<span class="text-blue-300 font-bold drop-shadow">👁️ [관찰 확신] 적의 행동을 정확히 예측했습니다.</span>`; 
        showVisualBubble = true; visualBubbleIcon = MOVE_ICONS[state.monsterNextMove]; 
    } else { 
        hintText = `"💡 ${hintText}"`; 
    }
    
    const currentTactic = TACTICS.find(t => t.id === p.tactic); 
    let tacticBadge = '';
    if (currentTactic && !p.tacticUsed && !['observe', 'lucky'].includes(p.tactic)) {
        tacticBadge = `<span class="text-lg font-bold text-slate-100 bg-slate-700/80 border-2 border-slate-400 px-4 py-1.5 rounded-full shadow-md backdrop-blur-sm">${currentTactic.icon} ${currentTactic.name} 대기</span>`;

    const monsterFloating = state.floatingTexts.filter(f=>f.target==='monster').map(f => `<div class="anim-float font-black ${f.colorClass}" style="left:50%; top:40%; transform:translate(-50%, -50%);">${f.text}</div>`).join('');
    const playerFloating = state.floatingTexts.filter(f=>f.target==='player').map(f => `<div class="anim-float font-black ${f.colorClass}" style="left:20%; top:20%; font-size:40px;">${f.text}</div>`).join('');
    const validAnimStates = ['idle', 'attack', 'draw', 'hit'];
    const playerAnimState = validAnimStates.includes(p.animState) ? p.animState : 'idle';
    const playerImageSrc = `./assets_hero/${p.cls.imgPrefix}_${playerAnimState}.png`;
    const playerIdleSrc = `./assets_hero/${p.cls.imgPrefix}_idle.png`;

    return audioBtn + `
        <div class="h-full w-full flex flex-row overflow-hidden bg-cover bg-center relative ${transitionClass}" style="background-image: url('${bgImage}');">
            <div class="absolute inset-0 bg-slate-900/60 z-0"></div>
            
            <div class="relative z-10 flex flex-row h-full w-full">

                    <div class="flex-1 flex flex-col items-center justify-center p-5 relative ${state.shakeTarget === 'monster' ? 'anim-shake' : ''}">
                        ${monsterFloating}

                        <div class="relative">
                            <div class="emoji text-[115px] mb-3 drop-shadow-2xl opacity-90">${mon.icon}</div>
                            ${showVisualBubble ? `<div class="absolute -top-6 -right-12 bg-white/90 rounded-full p-4 text-6xl shadow-2xl border-4 border-slate-300 anim-bubble z-20 flex items-center justify-center w-[100px] h-[100px]">${visualBubbleIcon}</div>` : ''}
                        </div>

                        <div class="text-3xl font-bold text-white title-font flex flex-wrap gap-3 items-center justify-center drop-shadow-lg text-center">
                            ${mon.name}
                            ${state.monsterStatus && state.monsterStatus.type === 'sealed' ? '<span class="text-xl bg-red-600 px-3 py-1 rounded-lg shadow-md">봉인됨</span>' : ''}
                            ${state.monsterStatus && state.monsterStatus.type === 'stunned' ? '<span class="text-xl bg-yellow-600 px-3 py-1 rounded-lg text-yellow-900 shadow-md">기절함</span>' : ''}
                        </div>
                        
                        <div class="w-3/4 max-w-md h-8 bg-slate-900/80 backdrop-blur-sm rounded-full mt-5 overflow-hidden border-4 border-slate-600 shadow-inner relative">
                            <div class="h-full bg-red-500 transition-all duration-300" style="width: ${monHpPercent}%"></div>
                            <div class="absolute inset-0 flex items-center justify-center text-lg font-bold text-white drop-shadow-md tracking-widest">${Math.max(0, state.monsterHp)} / ${mon.hp}</div>
                        </div>
                        
                        <div class="mt-5 bg-slate-800/80 backdrop-blur-md border-2 border-slate-500 rounded-2xl p-4 text-xl text-center shadow-2xl relative w-4/5 min-h-[78px] flex items-center justify-center text-balance leading-relaxed">

                            ${hintText}

                    </div>
                    
                    <div class="h-[170px] bg-slate-900/70 backdrop-blur-md border-t-4 border-slate-700/50 p-4 overflow-y-auto no-scrollbar text-lg flex flex-col-reverse gap-2 leading-relaxed shadow-inner">

                        <img onerror="if(!this.dataset.fallback){this.dataset.fallback='1'; this.src='${playerIdleSrc}';} else { this.style.display='none'; }" src="${playerImageSrc}" class="border-4 border-slate-500 rounded-3xl shrink-0 shadow-lg bg-white object-cover ${playerAnimState !== 'idle' ? 'anim-shake' : ''}" style="width: 120px; height: 120px; image-rendering: pixelated;" alt="Player">
                        <div class="flex-1">
                            <div class="text-3xl font-bold text-blue-300 title-font leading-tight mb-3 drop-shadow break-keep">Lv.${p.level} ${p.cls.name}</div>

                                ⚔️ ${p.atk} | 💰 ${p.gold} | 💣 ${p.inventory.bomb} | 💥 ${p.inventory.flash}
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4 shrink-0">
                        <div class="flex justify-between text-lg font-bold text-slate-200 mb-2 px-1 drop-shadow"><span>❤️ 생명력 (HP)</span></div>
                        <div class="h-8 bg-slate-900/80 backdrop-blur-sm rounded-full overflow-hidden border-4 border-slate-600 relative shadow-inner">
                            <div class="h-full ${p.hp <= p.maxHp * 0.3 ? 'bg-red-500 animate-pulse' : 'bg-green-500'} transition-all duration-300" style="width: ${pHpPercent}%"></div>
                            <div class="absolute inset-0 flex items-center justify-center text-xl font-bold text-white drop-shadow-md tracking-widest">${Math.max(0, p.hp)} / ${p.maxHp}</div>

                    </div>
                    
                    <div class="mb-4 shrink-0">

                        <div class="flex gap-2 h-7">
                            ${Array.from({length: p.maxEnergy}).map((_, i) => `<div class="flex-1 border-2 border-slate-600 rounded-lg ${i < p.energy ? 'bg-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.6)]' : 'bg-slate-900/80'}"></div>`).join('')}
                        </div>
                    </div>

                    <div class="flex flex-wrap gap-2 mb-3 min-h-[30px] shrink-0">
                        ${tacticBadge}
                        ${p.buff ? `<span class="text-lg font-bold text-yellow-100 bg-yellow-700/80 border-2 border-yellow-500 px-4 py-1.5 rounded-full shadow-md animate-pulse backdrop-blur-sm">🌟 스킬 장전</span>` : ''}
                    </div>

                    <div class="grid grid-cols-2 gap-3 mt-auto">
                        <button onclick="playTurn('scissors')" class="bg-slate-800/80 backdrop-blur-sm hover:bg-slate-700 border-4 border-slate-500 rounded-3xl py-3 shadow-xl active:scale-95 transition-all flex flex-col items-center justify-center gap-3 group focus:outline-none">
                            <span class="text-5xl group-hover:scale-110 transition-transform drop-shadow-md">✌️</span>
                            <span class="text-xl text-slate-200 font-bold drop-shadow">쌍검 베기</span>
                        </button>
                        <button onclick="playTurn('rock')" class="bg-slate-800/80 backdrop-blur-sm hover:bg-slate-700 border-4 border-slate-500 rounded-3xl py-3 shadow-xl active:scale-95 transition-all flex flex-col items-center justify-center gap-3 group focus:outline-none">
                            <span class="text-5xl group-hover:scale-110 transition-transform drop-shadow-md">✊</span>
                            <span class="text-xl text-slate-200 font-bold drop-shadow">방패 강타</span>
                        </button>
                        <button onclick="playTurn('paper')" class="bg-slate-800/80 backdrop-blur-sm hover:bg-slate-700 border-4 border-slate-500 rounded-3xl py-3 shadow-xl active:scale-95 transition-all flex flex-col items-center justify-center gap-3 group focus:outline-none">

                            <span class="text-xl text-slate-200 font-bold drop-shadow">마법 장막</span>
                        </button>
                        <button onclick="useSkill()" class="${p.energy >= (p.activeBuff==='mana_surge'?0:3) ? 'bg-purple-600/90 hover:bg-purple-500 border-purple-400' : 'bg-slate-800/80 text-slate-500 border-slate-600'} backdrop-blur-sm border-4 rounded-3xl py-3 shadow-xl active:scale-95 transition-all flex flex-col items-center justify-center gap-3 group focus:outline-none">
                            <span class="text-5xl ${p.energy >= (p.activeBuff==='mana_surge'?0:3) ? 'group-hover:scale-110 transition-transform drop-shadow-md' : 'opacity-50'}">✨</span>
                            <span class="text-xl font-bold ${p.energy >= (p.activeBuff==='mana_surge'?0:3) ? 'text-white drop-shadow' : 'text-slate-500'}">${p.activeBuff==='mana_surge'?'스킬(0)':'스킬(3)'}</span>

function renderShop(audioBtn, transitionClass, bgImage) {
    const mobilePortrait = isMobilePortraitMode();
